<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAFC Player Ratings</title>

<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#EB172B" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --safc-red: #EB172B;
    --safc-red-dark: #B8101F;
    --ink: #14110F;
    --paper: #F7F5F2;
    --card: #FFFFFF;
    --line: #E4E0D9;
    --muted: #6B6560;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .top-bar {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .top-bar b { color: var(--ink); }
  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  .tab-bar-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-bar-btn.active { color: var(--safc-red); }
  .tab-bar-icon { display: flex; }
  .tab-bar-icon svg { width: 20px; height: 20px; }

  .hero-card {
    background: var(--safc-red);
    color: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .hero-crest-img, .hero-crest-fallback { width: 40px; height: 40px; display: block; margin-bottom: 8px; }
  .hero-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; font-weight: 700; }
  .hero-teams { font-size: 17px; font-weight: 700; margin-top: 4px; font-family: 'Archivo Black', sans-serif; }
  .hero-meta { font-size: 13px; opacity: 0.9; margin-top: 4px; }

  .stats-table-header, .stats-table-row {
    display: grid;
    grid-template-columns: 22px 1fr 34px 24px 24px 42px;
    gap: 6px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .stats-table-header {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--line);
  }
  .stats-table-row { cursor: pointer; }
  .stats-table-row:last-child { border-bottom: none; }
  .st-rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .st-col { text-align: center; font-variant-numeric: tabular-nums; }
  .st-avg { font-weight: 700; }

  .league-table-header, .league-row {
    display: grid;
    grid-template-columns: 20px 1fr 24px 32px 32px;
    gap: 6px;
    align-items: center;
    padding: 6px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .league-table-header {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--line);
  }
  .league-row:last-child { border-bottom: none; }
  .league-row-safc { background: #FCE8EA; border-radius: 6px; font-weight: 700; }
  .lg-pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lg-col { text-align: center; font-variant-numeric: tabular-nums; }
  .lg-pts { font-weight: 700; }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 18px calc(88px + env(safe-area-inset-bottom));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--safc-red);
    margin: 0 0 10px;
  }
  .name-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .name-btn {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .name-btn:active { background: var(--safc-red); color: white; border-color: var(--safc-red); }

  .whoami {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
  }
  .whoami b { color: var(--ink); }
  .switch-link {
    color: var(--safc-red);
    font-weight: 600;
    text-decoration: none;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    min-height: 70px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    resize: vertical;
  }
  button.primary {
    margin-top: 10px;
    background: var(--safc-red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }
  button.primary:active { background: var(--safc-red-dark); }
  button.primary:disabled { opacity: 0.5; }

  .comment {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .comment:last-child { border-bottom: none; }
  .comment .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .comment .meta b { color: var(--ink); }
  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
  }
  .status {
    font-size: 13px;
    margin-top: 8px;
  }
  .status.ok { color: #157F3B; }
  .status.err { color: var(--safc-red); }

  .status-group { margin-bottom: 20px; }
  .status-group:last-child { margin-bottom: 0; }
  .status-group-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--safc-red);
    margin: 0 0 10px;
  }
  .position-group { margin-bottom: 14px; }
  .position-group:last-child { margin-bottom: 0; }
  .position-group h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
  }
  .player-row:active { background: var(--paper); }
  .player-row:last-child { border-bottom: none; }
  .player-row .num {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 26px;
    flex-shrink: 0;
  }
  .player-row .name { flex: 1; padding: 0 8px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .badge.squad { background: #E7F5EC; color: #157F3B; }
  .badge.loan { background: #FFF4E0; color: #A8630A; }
  .badge.academy { background: #E9EEFB; color: #2C4FA6; }
  .badge.left { background: #F1EFEB; color: var(--muted); }

  /* Player detail overlay */
  .player-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 100;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }
  .player-overlay.open { transform: translateX(0); }
  .player-overlay-header {
    background: var(--safc-red);
    color: white;
    padding: calc(env(safe-area-inset-top) + 16px) 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .player-overlay-back {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .player-overlay-header h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .player-overlay-header p {
    margin: 2px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .player-overlay-body { max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; }

  .player-photo-block { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .player-photo, .player-photo-fallback {
    width: 68px; height: 68px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid var(--line);
  }
  .player-photo-fallback {
    display: flex; align-items: center; justify-content: center;
    background: var(--safc-red);
    color: white;
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
  }
  .player-meta-line { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 4px;
  }
  .stat-cell {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-cell .val {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    color: var(--ink);
  }
  .stat-cell .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .bio-text { font-size: 14px; line-height: 1.55; white-space: pre-line; }

  .match-history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .match-history-row:last-child { border-bottom: none; }
  .mh-opponent { font-weight: 600; font-size: 14px; }
  .mh-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mh-extras { font-size: 12px; margin-top: 2px; }
  .mh-rating {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    flex-shrink: 0;
    padding-left: 10px;
    font-variant-numeric: tabular-nums;
  }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .edit-row input, .edit-row select {
    width: 100%;
    padding: 8px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .edit-row-fields { display: flex; gap: 6px; }
  .edit-row-fields input:first-child { width: 54px; flex-shrink: 0; }
  .field-group { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
  }
  .remove-player-link {
    color: var(--safc-red);
    font-size: 12px;
    text-decoration: none;
    align-self: flex-end;
  }

  .fixture-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .fixture-row:last-child { border-bottom: none; }
  .fixture-row .comp {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  .fixture-row .match-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3px;
  }
  .fixture-row .teams { font-weight: 600; }
  .fixture-row .datetime { color: var(--muted); font-size: 13px; }
  .fixture-row .score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="top-bar" id="topBar" style="display:none;">
  <span>Signed in as <b id="currentName"></b></span>
  <a href="#" class="switch-link" id="switchLink">Not you?</a>
</div>

<main>

  <!-- Stage 0 status card -->
  <div class="card" id="setupCard">
    <p class="eyebrow">Stage 0 check</p>
    <div id="setupStatus" class="status">Checking connection to the backend…</div>
  </div>

  <!-- Name picker -->
  <div class="card" id="pickerCard" style="display:none;">
    <p class="eyebrow">Who's this?</p>
    <div class="name-grid" id="nameGrid"></div>
  </div>

  <!-- Signed-in view: one tab panel per bottom-bar tab -->
  <div id="signedInArea" style="display:none;">

    <section id="tab-home">
      <div id="nextFixtureCard"></div>
      <div class="card" id="leagueTableCard"></div>
      <div class="card">
        <p class="eyebrow">Post a comment</p>
        <textarea id="commentText" placeholder="Say something about the Lads…"></textarea>
        <button class="primary" id="postCommentBtn">Post comment</button>
        <div id="commentStatus" class="status"></div>
      </div>
      <div class="card">
        <p class="eyebrow">Recent comments</p>
        <div id="commentsList"><div class="empty">No comments yet</div></div>
      </div>
    </section>

    <section id="tab-squad" style="display:none;">
      <div class="card">
        <p class="eyebrow">Squad</p>
        <div id="squadList"><div class="empty">Loading squad…</div></div>
      </div>
    </section>

    <section id="tab-fixtures" style="display:none;">
      <div class="card">
        <p class="eyebrow">Fixtures</p>
        <div id="fixturesList"><div class="empty">Loading fixtures…</div></div>
      </div>
    </section>

    <section id="tab-stats" style="display:none;">
      <div class="card">
        <p class="eyebrow">Season stats</p>
        <div id="statsStatus" class="status" style="margin-bottom:10px;"></div>
        <div id="statsTable"></div>
      </div>
    </section>

    <section id="tab-admin" style="display:none;"></section>

  </div>

</main>

<!-- Bottom tab bar — built by JS so the Admin tab is only ever added to the
     DOM for the owner, not just hidden by CSS for everyone else. -->
<nav class="tab-bar" id="tabBar" style="display:none;"></nav>

<!-- Player detail overlay (Stage 4) -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-overlay-header">
    <button class="player-overlay-back" id="playerOverlayBack" aria-label="Back">&larr;</button>
    <div>
      <h2 id="playerOverlayName">&nbsp;</h2>
      <p id="playerOverlaySub">&nbsp;</p>
    </div>
  </div>
  <div class="player-overlay-body" id="playerOverlayBody"></div>
</div>

<script src="config.js"></script>
<script>
  const state = { name: localStorage.getItem('safc_name') || null, config: null, players: [], comments: [], fixtures: [], matchStats: [] };

  const COUNTRIES = [
    ["England","GB-ENG"],["Scotland","GB-SCT"],["Wales","GB-WLS"],["Northern Ireland","GB-NIR"],
    ["Republic of Ireland","IE"],["France","FR"],["Germany","DE"],["Netherlands","NL"],["Belgium","BE"],
    ["Portugal","PT"],["Spain","ES"],["Italy","IT"],["Switzerland","CH"],["Austria","AT"],["Denmark","DK"],
    ["Norway","NO"],["Sweden","SE"],["Finland","FI"],["Iceland","IS"],["Poland","PL"],["Czech Republic","CZ"],
    ["Slovakia","SK"],["Hungary","HU"],["Romania","RO"],["Croatia","HR"],["Serbia","RS"],["Slovenia","SI"],
    ["Bosnia and Herzegovina","BA"],["Montenegro","ME"],["North Macedonia","MK"],["Albania","AL"],["Kosovo","XK"],
    ["Greece","GR"],["Turkey","TR"],["Armenia","AM"],["Ukraine","UA"],["Russia","RU"],["Ghana","GH"],["Nigeria","NG"],
    ["Senegal","SN"],["Ivory Coast","CI"],["Mali","ML"],["Guinea","GN"],["DR Congo","CD"],["Cameroon","CM"],
    ["Morocco","MA"],["Algeria","DZ"],["Tunisia","TN"],["Egypt","EG"],["South Africa","ZA"],["Mozambique","MZ"],["Brazil","BR"],
    ["Argentina","AR"],["Uruguay","UY"],["Paraguay","PY"],["Colombia","CO"],["Ecuador","EC"],["Chile","CL"],["USA","US"],
    ["Canada","CA"],["Jamaica","JM"],["Trinidad and Tobago","TT"],["Haiti","HT"],["Australia","AU"],["Japan","JP"],
    ["South Korea","KR"],["Iran","IR"],["Israel","IL"],
  ];

  // Real flag emoji work reliably everywhere, but England/Scotland/Wales use a
  // special multi-part Unicode sequence with inconsistent device support — when
  // unsupported it silently falls back to a plain black flag. Rather than rely
  // on that (or a text-only badge), those three get a small hand-drawn inline
  // SVG flag instead, sized to sit inline with the emoji flags used elsewhere.
  const HOME_NATION_FLAG_SVGS = {
    'GB-ENG': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="36" fill="#FFFFFF"/>
      <rect x="24" width="12" height="36" fill="#CE1124"/>
      <rect y="12" width="60" height="12" fill="#CE1124"/>
    </svg>`,
    'GB-SCT': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="36" fill="#005EB8"/>
      <polygon points="0,0 8,0 60,32 60,36 52,36 0,4" fill="#FFFFFF"/>
      <polygon points="60,0 52,0 0,32 0,36 8,36 60,4" fill="#FFFFFF"/>
    </svg>`,
    'GB-WLS': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="18" fill="#FFFFFF"/>
      <rect y="18" width="60" height="18" fill="#00843D"/>
      <path d="M18,26 C14,24 13,19 16,16 C14,14 15,10 19,10 C20,7 24,6 27,8
               C29,6 33,7 33,10 C37,9 40,12 38,15 C41,16 41,20 38,21
               C39,24 36,27 32,25 C31,28 26,29 24,26 C22,28 19,28 18,26 Z"
            fill="#C8102E"/>
      <path d="M33,10 L41,5 L38,12 Z" fill="#C8102E"/>
      <path d="M16,16 L8,13 L14,20 Z" fill="#C8102E"/>
      <path d="M27,20 L24,24" stroke="#C8102E" stroke-width="1.5" fill="none"/>
    </svg>`,
    // Northern Ireland has no official flag today — this is the Ulster Banner
    // (white field, red St George's cross, Red Hand of Ulster), the flag
    // conventionally used to represent Northern Ireland in football contexts.
    'GB-NIR': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="36" fill="#FFFFFF"/>
      <rect x="26" width="8" height="36" fill="#CE1124"/>
      <rect y="14" width="60" height="8" fill="#CE1124"/>
      <circle cx="30" cy="18" r="8" fill="#FFFFFF" stroke="#CE1124" stroke-width="1"/>
      <g stroke="#CE1124" stroke-width="1.6" stroke-linecap="round" fill="none">
        <path d="M30,23 L30,13"/>
        <path d="M26.5,23 L25,14.5"/>
        <path d="M33.5,23 L35,14.5"/>
        <path d="M23.5,23 L21,17"/>
        <path d="M36.5,23 L39,17"/>
        <path d="M23.5,23 L36.5,23"/>
      </g>
    </svg>`,
  };

  function flagEmoji(code) {
    if (!code) return '';
    if (HOME_NATION_FLAG_SVGS[code]) return HOME_NATION_FLAG_SVGS[code];
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  // Plain-text-only version for use inside <option> tags, which can't render
  // SVG/HTML at all — this stays text-only regardless of the fix above.
  function flagText(code) {
    if (!code) return '';
    if (code === 'GB-ENG') return 'ENG';
    if (code === 'GB-SCT') return 'SCO';
    if (code === 'GB-WLS') return 'WAL';
    if (code === 'GB-NIR') return 'NIR';
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  const el = (id) => document.getElementById(id);

  async function apiGet(file) {
    const res = await fetch(`${WORKER_URL}/api/data?file=${encodeURIComponent(file)}`);
    if (!res.ok) throw new Error(`Read failed (${res.status})`);
    return (await res.json()).content;
  }

  async function apiPost(path, body) {
    const res = await fetch(`${WORKER_URL}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    return res.json();
  }

  async function init() {
    if (!WORKER_URL || WORKER_URL.startsWith('REPLACE')) {
      el('setupStatus').textContent = 'config.js still has the placeholder Worker URL — edit it with your real Worker URL.';
      el('setupStatus').className = 'status err';
      return;
    }
    try {
      const health = await fetch(`${WORKER_URL}/api/health`).then(r => r.json());
      if (!health.ok) throw new Error('Backend did not report healthy');

      const config = await apiGet('data/config.json');
      state.config = config || { season: 'unknown', names: [] };
      el('setupStatus').textContent = 'Connected to backend and repo successfully.';
      el('setupStatus').className = 'status ok';
      el('setupCard').style.display = 'none'; // hide once healthy, keeps the app clean day-to-day

      renderNamePicker();
      if (state.name) showSignedIn();
    } catch (err) {
      el('setupStatus').textContent = `Connection failed: ${err.message}. Check the Worker URL in config.js and that the Worker is deployed.`;
      el('setupStatus').className = 'status err';
    }
  }

  function renderNamePicker() {
    const grid = el('nameGrid');
    grid.innerHTML = '';
    (state.config.names || []).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.textContent = name;
      btn.onclick = () => {
        state.name = name;
        localStorage.setItem('safc_name', name);
        showSignedIn();
      };
      grid.appendChild(btn);
    });
    el('pickerCard').style.display = state.name ? 'none' : 'block';
  }

  function showSignedIn() {
    el('pickerCard').style.display = 'none';
    el('signedInArea').style.display = 'block';
    el('topBar').style.display = 'flex';
    el('currentName').textContent = state.name;
    loadComments();
    loadSquad();
    loadFixtures();
    loadMatchStats();
    loadLeagueTable();

    const isOwner = state.config && state.name === state.config.owner;
    el('tab-admin').innerHTML = ''; // clear any previous session's admin markup first
    if (isOwner) renderAdminTab();
    renderTabBar(isOwner);
    switchTab('home');
  }

  // Small monoline icons (Feather-style, generic UI glyphs — not any club's
  // branded imagery) for the bottom tab bar.
  const TAB_ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    squad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    fixtures: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
  };
  const TABS = [
    { id: 'home', label: 'Home' },
    { id: 'squad', label: 'Squad' },
    { id: 'fixtures', label: 'Fixtures' },
    { id: 'stats', label: 'Stats' },
  ];
  const ADMIN_TAB_ENTRY = { id: 'admin', label: 'Admin' };

  // Admin only ever appears in this array — and therefore in the tab bar's
  // markup — when isOwner is true, so non-owners have no button leading
  // anywhere near owner tools, not just a hidden one.
  function renderTabBar(isOwner) {
    const tabs = isOwner ? [...TABS, ADMIN_TAB_ENTRY] : TABS;
    el('tabBar').innerHTML = tabs.map(t => `
      <button class="tab-bar-btn" data-tab="${t.id}" onclick="switchTab('${t.id}')">
        <span class="tab-bar-icon">${TAB_ICONS[t.id]}</span>
        <span>${t.label}</span>
      </button>
    `).join('');
    el('tabBar').style.display = 'flex';
  }

  const ALL_TAB_IDS = ['home', 'squad', 'fixtures', 'stats', 'admin'];

  window.switchTab = (tabId) => {
    ALL_TAB_IDS.forEach(id => {
      const panel = el('tab-' + id);
      if (panel) panel.style.display = (id === tabId) ? 'block' : 'none';
    });
    el('tabBar').querySelectorAll('.tab-bar-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabId);
    });
    window.scrollTo(0, 0);
    if (tabId === 'stats') renderStatsTab();
  };

  // A generic shield — deliberately NOT the real club crest (trademarked;
  // not something to source or reproduce here). If the owner adds a real
  // crest.png to the frontend repo themselves, that's used instead.
  window.makeGenericCrest = () => {
    const div = document.createElement('div');
    div.className = 'hero-crest-fallback';
    div.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 3 L35 8 V19 C35 28 28 34 20 37 C12 34 5 28 5 19 V8 Z" fill="#ffffff" fill-opacity="0.25"/><path d="M20 3 L35 8 V19 C35 28 28 34 20 37 Z" fill="#ffffff" fill-opacity="0.12"/></svg>';
    return div;
  };

  function crestMarkup() {
    return `<img src="crest.png" alt="Club crest" class="hero-crest-img" onerror="this.replaceWith(makeGenericCrest())" />`;
  }

  // Home tab hero: next unplayed fixture by date, or the most recent result
  // if nothing's upcoming (e.g. between the last match of a run and the
  // next one being added).
  function renderNextFixtureCard() {
    const card = el('nextFixtureCard');
    if (!card) return;
    if (!state.fixtures.length) {
      card.innerHTML = '<div class="card"><div class="empty">No fixtures yet</div></div>';
      return;
    }
    const now = new Date();
    const upcoming = state.fixtures
      .filter(f => f.status === 'NS' && new Date(f.date) >= now)
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    if (upcoming.length) {
      const next = upcoming[0];
      const opponent = next.isHome ? next.awayTeam : next.homeTeam;
      const venueTag = next.isHome ? 'H' : 'A';
      card.innerHTML = `
        <div class="hero-card">
          ${crestMarkup()}
          <div class="hero-label">Next match</div>
          <div class="hero-teams">${venueTag} vs ${escapeHtml(opponent)}</div>
          <div class="hero-meta">${formatFixtureDate(next.date)}${next.venue ? ' · ' + escapeHtml(next.venue) : ''}</div>
        </div>
      `;
      return;
    }

    const played = state.fixtures
      .filter(f => ['FT', 'AET', 'PEN'].includes(f.status))
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!played.length) {
      card.innerHTML = '<div class="card"><div class="empty">No fixtures yet</div></div>';
      return;
    }
    const last = played[0];
    const opponent = last.isHome ? last.awayTeam : last.homeTeam;
    const venueTag = last.isHome ? 'H' : 'A';
    card.innerHTML = `
      <div class="hero-card">
        ${crestMarkup()}
        <div class="hero-label">Last result</div>
        <div class="hero-teams">${venueTag} vs ${escapeHtml(opponent)}</div>
        <div class="hero-meta">${last.homeScore}-${last.awayScore} · ${formatFixtureDate(last.date).split(',')[0]}</div>
      </div>
    `;
  }

  // Stats tab: ranked by average match rating for now — the simplest fair
  // read on a small dataset. Worth revisiting once a full season of real
  // results makes a more considered "player of the season" formula (weighting
  // goals/assists/appearances) meaningful rather than arbitrary.
  function renderStatsTab() {
    const container = el('statsTable');
    const status = el('statsStatus');
    if (!container || !status) return;

    const rows = state.players
      .filter(p => p.status !== 'left')
      .map(p => ({ player: p, stats: computeSeasonStats(p) }))
      .filter(r => r.stats.appearances > 0);

    if (!rows.length) {
      status.textContent = 'No match stats recorded yet this season.';
      status.className = 'status';
      container.innerHTML = '';
      return;
    }

    status.textContent = 'Ranked by average match rating (minimum 1 appearance). Tap a player for the full breakdown.';
    status.className = 'status';
    rows.sort((a, b) => (b.stats.avgRating ?? 0) - (a.stats.avgRating ?? 0));

    container.innerHTML = `
      <div class="stats-table-header">
        <span></span>
        <span>Player</span>
        <span class="st-col">Apps</span>
        <span class="st-col">G</span>
        <span class="st-col">A</span>
        <span class="st-col">Avg</span>
      </div>
      ${rows.map((r, i) => `
        <div class="stats-table-row" onclick="openPlayerDetail('${r.player.id}')">
          <span class="st-rank">${i + 1}</span>
          <span>${escapeHtml(r.player.name)}</span>
          <span class="st-col">${r.stats.appearances}</span>
          <span class="st-col">${r.stats.goals}</span>
          <span class="st-col">${r.stats.assists}</span>
          <span class="st-col st-avg">${r.stats.avgRating !== null ? r.stats.avgRating.toFixed(1) : '—'}</span>
        </div>
      `).join('')}
    `;
  }

  const POSITION_ORDER = ['GK', 'DEF', 'MID', 'FWD'];
  const POSITION_LABELS = { GK: 'Goalkeepers', DEF: 'Defenders', MID: 'Midfielders', FWD: 'Forwards' };
  // Squad first (most likely to feature), then loan/academy (rarely feature but
  // still worth having to hand), left last — avoids scrolling past fringe
  // players to find who's actually going to play week to week.
  const STATUS_GROUPS = [
    ['squad', "First-team squad (with Lucas's Notes)"],
    ['loan', 'On loan'],
    ['academy', 'Academy'],
    ['left', 'Departed'],
  ];

  async function loadSquad() {
    try {
      state.players = await apiGet('data/players.json') || [];
      renderSquadList();
    } catch (err) {
      el('squadList').innerHTML = `<div class="empty">Couldn't load squad (${err.message})</div>`;
    }
  }

  function renderSquadList() {
    const container = el('squadList');
    if (!state.players.length) {
      container.innerHTML = '<div class="empty">No players yet</div>';
      return;
    }
    container.innerHTML = STATUS_GROUPS.map(([status, statusLabel]) => {
      const inStatus = state.players.filter(p => (p.status || 'squad') === status);
      if (!inStatus.length) return '';
      const positionBlocks = POSITION_ORDER.map(pos => {
        const players = inStatus
          .filter(p => p.position === pos)
          .sort((a, b) => (a.squadNumber ?? 999) - (b.squadNumber ?? 999));
        if (!players.length) return '';
        const rows = players.map(p => `
          <div class="player-row" onclick="openPlayerDetail('${p.id}')">
            <span class="num">${p.squadNumber ?? '—'}</span>
            <span class="name">${flagEmoji(p.nationality)} ${escapeHtml(p.name)}${p.note ? ` <span style="color:var(--muted);font-size:12px;">— ${escapeHtml(p.note)}</span>` : ''}</span>
            <span class="badge ${p.status}">${p.status}</span>
          </div>
        `).join('');
        return `<div class="position-group"><h4>${POSITION_LABELS[pos]}</h4>${rows}</div>`;
      }).join('');
      return `<div class="status-group"><p class="status-group-header">${escapeHtml(statusLabel)}</p>${positionBlocks}</div>`;
    }).join('');
  }

  // ---- Player detail overlay (Stage 4) ----

  // Player initials for the photo fallback badge, e.g. "A. Patterson" -> "AP".
  // Height is entered and stored in cm (matches FotMob and every other
  // source), but displayed as feet/inches, which is what most of the family
  // will actually picture.
  function formatHeight(cm) {
    if (cm === null || cm === undefined) return null;
    const totalInches = cm / 2.54;
    let feet = Math.floor(totalInches / 12);
    let inches = Math.round(totalInches - feet * 12);
    if (inches === 12) { feet += 1; inches = 0; }
    return `${feet}' ${inches}"`;
  }

  function playerInitials(name) {
    if (!name) return '?';
    const parts = name.replace(/\./g, '').split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // Season stats are never stored — always recomputed from data/match-stats.json
  // plus data/fixtures.json, so corrections to either source are reflected
  // immediately without any separate "recalculate" step.
  function computeSeasonStats(player) {
    const records = state.matchStats.filter(r => r.playerId === player.id);
    const appeared = records.filter(r => r.appearance === 'start' || r.appearance === 'sub');

    const sum = (key) => appeared.reduce((total, r) => total + (r[key] || 0), 0);
    const ratings = appeared.map(r => r.rating).filter(r => r !== null && r !== undefined);
    const avgRating = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null;

    const stats = {
      appearances: appeared.length,
      starts: records.filter(r => r.appearance === 'start').length,
      subApps: records.filter(r => r.appearance === 'sub').length,
      minutes: sum('minutes'),
      goals: sum('goals'),
      assists: sum('assists'),
      yellowCards: sum('yellowCards'),
      redCards: sum('redCards'),
      avgRating,
      cleanSheets: null,
      goalsConceded: null,
    };

    if (player.position === 'GK' || player.position === 'DEF') {
      let cleanSheets = 0;
      let goalsConceded = 0;
      appeared.forEach(r => {
        const fixture = state.fixtures.find(f => f.id === r.matchId);
        if (!fixture || !['FT', 'AET', 'PEN'].includes(fixture.status)) return;
        const conceded = fixture.isHome ? fixture.awayScore : fixture.homeScore;
        if (conceded === null || conceded === undefined) return;
        goalsConceded += conceded;
        if (conceded === 0) cleanSheets++;
      });
      stats.cleanSheets = cleanSheets;
      stats.goalsConceded = goalsConceded;
    }

    return stats;
  }

  function statCell(value, label) {
    const display = (value === null || value === undefined) ? '—' : value;
    return `<div class="stat-cell"><div class="val">${display}</div><div class="lbl">${label}</div></div>`;
  }

  // Match-by-match ratings — average rating alone can hide a run of poor
  // matches offset by one standout one, so this surfaces the actual spread.
  // Chronological (oldest first), each row tied back to its fixture for the
  // opponent/scoreline, since match-stats records don't duplicate that data.
  function buildMatchHistoryRows(player) {
    const records = state.matchStats.filter(r => r.playerId === player.id);
    const withFixture = records
      .map(r => ({ r, fixture: state.fixtures.find(f => f.id === r.matchId) }))
      .filter(x => x.fixture);
    withFixture.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));

    if (!withFixture.length) {
      return '<div class="empty">No matches recorded yet.</div>';
    }

    return withFixture.map(({ r, fixture }) => {
      const opponent = fixture.isHome ? fixture.awayTeam : fixture.homeTeam;
      const venueTag = fixture.isHome ? 'H' : 'A';
      const scoreOrDate = ['FT', 'AET', 'PEN'].includes(fixture.status)
        ? `${fixture.homeScore}-${fixture.awayScore}`
        : formatFixtureDate(fixture.date).split(',')[0];

      const involvementLabel = r.appearance === 'start'
        ? 'Started'
        : r.appearance === 'sub'
          ? `Sub (on ${r.subOnMinute ?? '?'}')`
          : 'Unused sub';

      const extras = [];
      if (r.goals) extras.push(`${r.goals} ⚽`);
      if (r.assists) extras.push(`${r.assists} 🅰️`);
      if (r.yellowCards) extras.push('🟨'.repeat(r.yellowCards));
      if (r.redCards) extras.push('🟥');

      const ratingDisplay = (r.rating !== null && r.rating !== undefined) ? r.rating.toFixed(1) : '—';

      return `
        <div class="match-history-row">
          <div>
            <div class="mh-opponent">${venueTag} vs ${escapeHtml(opponent)}</div>
            <div class="mh-meta">${scoreOrDate} · ${involvementLabel}${r.minutes ? ' · ' + r.minutes + "'" : ''}</div>
            ${extras.length ? `<div class="mh-extras">${extras.join(' ')}</div>` : ''}
          </div>
          <div class="mh-rating">${ratingDisplay}</div>
        </div>
      `;
    }).join('');
  }

  // Live table, not tied to Sunderland's own fixtures — updates whenever any
  // Premier League match finishes, via football-data.org (proxied through
  // the Worker so the API token stays out of the public frontend repo).
  async function loadLeagueTable() {
    const card = el('leagueTableCard');
    if (!card) return;
    card.innerHTML = '<p class="eyebrow" style="margin:0;">Premier League table</p><div class="empty">Loading table…</div>';
    try {
      const res = await fetch(`${WORKER_URL}/api/standings`);
      const data = await res.json();
      if (!res.ok || !data.table) throw new Error(data.error || 'Could not load table');
      renderLeagueTable(data);
    } catch (err) {
      card.innerHTML = `<p class="eyebrow" style="margin:0;">Premier League table</p><div class="empty">Couldn't load the table (${err.message})</div>`;
    }
  }

  function renderLeagueTable(data) {
    const card = el('leagueTableCard');

    // football-data.org can return fully-populated "table" data for a season
    // that hasn't started — the season *dates* were correct but the numbers
    // were clearly synthetic (a newly-promoted Sunderland finishing 7th with
    // 54 points, 38 games in, before a ball's been kicked). Rather than trust
    // anything the API says about whether the season is "real", we check
    // against today's actual date, which we know for certain.
    const now = new Date();
    const seasonStart = data.seasonStart ? new Date(data.seasonStart) : null;
    if (seasonStart && now < seasonStart) {
      card.innerHTML = `
        <p class="eyebrow" style="margin:0;">Premier League table</p>
        <div class="empty">Season kicks off ${formatFixtureDate(data.seasonStart).split(',')[0]} — the table will appear here once matches start being played.</div>
      `;
      return;
    }

    const rows = data.table.map(r => `
      <div class="league-row ${/sunderland/i.test(r.team) ? 'league-row-safc' : ''}">
        <span class="lg-pos">${r.position}</span>
        <span>${escapeHtml(r.team)}</span>
        <span class="lg-col">${r.played}</span>
        <span class="lg-col">${r.goalDifference > 0 ? '+' : ''}${r.goalDifference}</span>
        <span class="lg-col lg-pts">${r.points}</span>
      </div>
    `).join('');

    const updated = data.updated
      ? new Date(data.updated).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      : '';
    card.innerHTML = `
      <p class="eyebrow" style="margin:0;">Premier League table</p>
      <div class="league-table-header">
        <span></span><span>Team</span><span class="lg-col">P</span><span class="lg-col">GD</span><span class="lg-col">Pts</span>
      </div>
      ${rows}
      ${updated ? `<div class="player-meta-line" style="margin-top:8px;">Updated ${updated}</div>` : ''}
    `;
  }

  window.openPlayerDetail = (playerId) => {
    const player = state.players.find(p => p.id === playerId);
    if (!player) return;
    const stats = computeSeasonStats(player);

    el('playerOverlayName').textContent = player.name;
    el('playerOverlaySub').textContent = `${player.squadNumber ? '#' + player.squadNumber + ' · ' : ''}${POSITION_LABELS[player.position] || player.position}`;

    const photoBlock = player.photo
      ? `<img class="player-photo" src="${player.photo}" alt="${escapeHtml(player.name)}" onerror="this.outerHTML='<div class=&quot;player-photo-fallback&quot;>${playerInitials(player.name)}</div>'" />`
      : `<div class="player-photo-fallback">${playerInitials(player.name)}</div>`;

    const ratingDisplay = stats.avgRating !== null ? stats.avgRating.toFixed(1) : '—';

    const statCells = [
      statCell(stats.appearances, 'Apps'),
      statCell(stats.starts, 'Starts'),
      statCell(stats.subApps, 'Sub apps'),
      statCell(stats.minutes, 'Minutes'),
      statCell(stats.goals, 'Goals'),
      statCell(stats.assists, 'Assists'),
      statCell(stats.yellowCards, 'Yellow'),
      statCell(stats.redCards, 'Red'),
      statCell(ratingDisplay, 'Avg rating'),
    ];
    if (player.position === 'GK' || player.position === 'DEF') {
      statCells.push(statCell(stats.cleanSheets, 'Clean sheets'));
      statCells.push(statCell(stats.goalsConceded, 'Conceded'));
    }

    const bio = player.biography && player.biography.trim()
      ? `<div class="bio-text">${escapeHtml(player.biography)}</div>`
      : `<div class="empty" style="text-align:left;padding:0;">No biography yet.</div>`;

    el('playerOverlayBody').innerHTML = `
      <div class="card">
        <div class="player-photo-block">
          ${photoBlock}
          <div>
            <div style="font-weight:700;font-size:16px;">${flagEmoji(player.nationality)} ${escapeHtml(player.name)}</div>
            <div class="player-meta-line">${[
              player.age ? player.age + ' years old' : null,
              player.height ? formatHeight(player.height) : null,
            ].filter(Boolean).join(' · ') || 'Age/height unknown'}</div>
            ${player.transferValue ? `<div class="player-meta-line">Market value: ${escapeHtml(player.transferValue)}</div>` : ''}
            <span class="badge ${player.status}" style="margin-top:6px;display:inline-block;">${player.status}</span>
          </div>
        </div>
        ${player.note ? `<div style="margin-top:8px;"><p class="eyebrow" style="margin:0 0 2px;">Lucas's Notes</p><div class="player-meta-line">${escapeHtml(player.note)}</div></div>` : ''}
      </div>

      <div class="card">
        <p class="eyebrow">2026-27 season</p>
        <div class="stat-grid">${statCells.join('')}</div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <p class="eyebrow" style="margin:0;">Match-by-match ratings</p>
          <a href="#" id="toggleMatchHistoryLink" style="font-size:13px;color:var(--safc-red);font-weight:600;text-decoration:none;">Show</a>
        </div>
        <div id="playerMatchHistoryList" style="display:none;margin-top:8px;">${buildMatchHistoryRows(player)}</div>
      </div>

      <div class="card">
        <p class="eyebrow">Biography</p>
        ${bio}
      </div>
    `;

    el('playerOverlay').classList.add('open');

    const toggleLink = el('toggleMatchHistoryLink');
    toggleLink.onclick = (e) => {
      e.preventDefault();
      const list = el('playerMatchHistoryList');
      const isOpen = list.style.display === 'block';
      list.style.display = isOpen ? 'none' : 'block';
      toggleLink.textContent = isOpen ? 'Show' : 'Hide';
    };
  };

  window.closePlayerDetail = () => {

  function formatFixtureDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) +
      ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadFixtures() {
    try {
      state.fixtures = await apiGet('data/fixtures.json') || [];
      renderFixturesList();
      renderNextFixtureCard();
    } catch (err) {
      el('fixturesList').innerHTML = `<div class="empty">Couldn't load fixtures (${err.message})</div>`;
    }
  }

  function renderFixturesList() {
    const container = el('fixturesList');
    if (!state.fixtures.length) {
      container.innerHTML = '<div class="empty">No fixtures yet — tap "Sync fixtures" in Owner tools</div>';
      return;
    }
    container.innerHTML = state.fixtures.map(f => {
      const opponent = f.isHome ? f.awayTeam : f.homeTeam;
      const venueTag = f.isHome ? 'H' : 'A';
      let scoreOrTime;
      if (['FT', 'AET', 'PEN'].includes(f.status)) {
        scoreOrTime = `<span class="score">${f.homeScore} - ${f.awayScore}</span>`;
      } else if (f.status === 'PST') {
        scoreOrTime = '<span class="datetime">Postponed</span>';
      } else if (f.status === 'CANC') {
        scoreOrTime = '<span class="datetime">Cancelled</span>';
      } else {
        scoreOrTime = `<span class="datetime">${formatFixtureDate(f.date)}</span>`;
      }
      return `
        <div class="fixture-row">
          <div class="comp">${escapeHtml(f.competition)}${f.round ? ' · ' + escapeHtml(f.round) : ''}</div>
          <div class="match-line">
            <span class="teams">${venueTag} vs ${escapeHtml(opponent)}</span>
            ${scoreOrTime}
          </div>
        </div>
      `;
    }).join('');
  }

  function wireAdminHandlers() {
  el('manageSquadBtn').onclick = () => {

  function renderManageSquad() {

  // Reads whatever's currently in the form's input boxes back into
  // state.players, WITHOUT writing to the server. Anything typed but not yet
  // saved only exists in these DOM inputs — any action that calls
  // renderManageSquad() (adding or removing a row) wipes and rebuilds the
  // form from state.players, so this must run first or in-progress edits on
  // every other row get silently discarded. This was exactly the bug: Remove
  // used to skip this step entirely.
  function syncSquadFormToState() {
    const rows = el('manageSquadArea').querySelectorAll('.edit-row');
    rows.forEach(row => {
      const i = Number(row.dataset.index);
      if (!state.players[i]) return;
      const num = row.querySelector('.f-number').value;
      const age = row.querySelector('.f-age').value;
      const height = row.querySelector('.f-height').value;
      state.players[i].squadNumber = num === '' ? null : Number(num);
      state.players[i].name = row.querySelector('.f-name').value;
      state.players[i].position = row.querySelector('.f-position').value;
      state.players[i].status = row.querySelector('.f-status').value;
      state.players[i].age = age === '' ? null : Number(age);
      state.players[i].height = height === '' ? null : Number(height);
      state.players[i].transferValue = row.querySelector('.f-value').value || null;
      state.players[i].photo = row.querySelector('.f-photo').value || null;
      state.players[i].nationality = row.querySelector('.f-nationality').value || null;
      state.players[i].biography = row.querySelector('.f-bio').value;
      state.players[i].note = row.querySelector('.f-note').value || null;
    });
  }

  window.addPlayerRow = () => {
    syncSquadFormToState();
    state.players.push({
      id: `manual_${Date.now()}`,
      name: '',
      squadNumber: null,
      position: 'MID',
      age: null,
      height: null,
      transferValue: null,
      photo: null,
      status: 'squad',
      note: '',
      nationality: null,
      biography: '',
      seasonStats: {},
    });
    renderManageSquad();
  };

  window.removePlayerRow = (index) => {
    syncSquadFormToState();
    state.players.splice(index, 1);
    renderManageSquad();
  };

  window.saveSquad = async () => {
    syncSquadFormToState();
    // Trim now, at the point of saving, rather than on every keystroke sync —
    // avoids fighting the cursor position while someone's still typing.
    state.players.forEach(p => {
      p.name = (p.name || '').trim();
      p.transferValue = p.transferValue ? p.transferValue.trim() || null : null;
      p.photo = p.photo ? p.photo.trim() || null : null;
      p.biography = (p.biography || '').trim();
      p.note = p.note ? p.note.trim() || null : null;
    });

    const pin = el('ownerPin').value;
    el('manageStatus').textContent = 'Saving…';
    el('manageStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/players.json', content: state.players, message: 'Manual squad edit from app' }),

      if (!res.ok) throw new Error(data.error || 'Save failed');
      el('manageStatus').textContent = 'Saved.';
      el('manageStatus').className = 'status ok';
      renderManageSquad();
      renderSquadList();

      el('manageStatus').textContent = `Failed: ${err.message}`;
      el('manageStatus').className = 'status err';

  el('manageFixturesBtn').onclick = () => {
    const area = el('manageFixturesArea');
    const isOpen = area.style.display === 'block';
    area.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) renderManageFixtures();

  const FIXTURE_STATUSES = [
    ['NS', 'Scheduled'],
    ['FT', 'Full time'],
    ['AET', 'After extra time'],
    ['PEN', 'Decided on penalties'],
    ['PST', 'Postponed'],
    ['CANC', 'Cancelled'],
  ];
  const COMPETITIONS = ['Premier League', 'FA Cup', 'EFL Cup', 'UEFA Europa League', 'Other'];

  // Splits a fixture's stored ISO date into separate date/time input values,
  // and figures out the opponent name regardless of home/away.
  function fixtureToFormValues(f) {
    const d = new Date(f.date);
    const pad = (n) => String(n).padStart(2, '0');
    const dateStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const opponent = f.isHome ? f.awayTeam : f.homeTeam;
    return { dateStr, timeStr, opponent };
  }

  function renderManageFixtures() {
    const area = el('manageFixturesArea');
    const sorted = state.fixtures.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    area.innerHTML = sorted.map((f) => {
      const { dateStr, timeStr, opponent } = fixtureToFormValues(f);
      return `
      <div class="edit-row" data-id="${f.id}">
        <div class="edit-row-fields">
          <input type="date" class="fx-date" value="${dateStr}" />
          <input type="time" class="fx-time" value="${timeStr}" />
        </div>
        <div class="edit-row-fields">
          <input type="text" class="fx-opponent" value="${escapeHtml(opponent)}" placeholder="Opponent" style="flex:1;" />
          <select class="fx-venue" style="width:70px;flex-shrink:0;">
            <option value="H" ${f.isHome ? 'selected' : ''}>Home</option>
            <option value="A" ${!f.isHome ? 'selected' : ''}>Away</option>
          </select>
        </div>
        <div class="edit-row-fields">
          <select class="fx-competition">
            ${COMPETITIONS.map(c => `<option value="${c}" ${f.competition === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
          <input type="text" class="fx-round" value="${escapeHtml(f.round || '')}" placeholder="Round / Matchday" />
        </div>
        <div class="edit-row-fields">
          <select class="fx-status">
            ${FIXTURE_STATUSES.map(([code, label]) => `<option value="${code}" ${f.status === code ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
          <input type="number" class="fx-home-score" value="${f.homeScore ?? ''}" placeholder="Home score" min="0" />
          <input type="number" class="fx-away-score" value="${f.awayScore ?? ''}" placeholder="Away score" min="0" />
        </div>
        <a href="#" class="remove-player-link" onclick="removeFixtureRow('${f.id}');return false;">Remove fixture</a>
      </div>
    `;
    }).join('') + `
      <button class="primary" style="background:var(--ink);margin-top:10px;" onclick="addFixtureRow()">+ Add fixture</button>
      <button class="primary" style="margin-top:8px;" onclick="saveFixtures()">Save all changes</button>
    `;
  }

  window.addFixtureRow = () => {
    state.fixtures.push({
      id: `manual_${Date.now()}`,
      date: new Date().toISOString(),
      status: 'NS',
      venue: null,
      competition: 'Premier League',
      round: '',
      homeTeam: state.config?.club || 'Sunderland AFC',
      awayTeam: '',
      isHome: true,
      homeScore: null,
      awayScore: null,
    });
    renderManageFixtures();
  };

  window.removeFixtureRow = (id) => {
    state.fixtures = state.fixtures.filter(f => f.id !== id);
    renderManageFixtures();
  };

  window.saveFixtures = async () => {
    const club = state.config?.club || 'Sunderland AFC';
    const rows = el('manageFixturesArea').querySelectorAll('.edit-row');
    const updated = [];
    rows.forEach(row => {
      const id = row.dataset.id;
      const existing = state.fixtures.find(f => f.id === id) || {};
      const dateStr = row.querySelector('.fx-date').value;
      const timeStr = row.querySelector('.fx-time').value || '15:00';
      const opponent = row.querySelector('.fx-opponent').value.trim();
      const isHome = row.querySelector('.fx-venue').value === 'H';
      const competition = row.querySelector('.fx-competition').value;
      const round = row.querySelector('.fx-round').value.trim();
      const status = row.querySelector('.fx-status').value;
      const homeScoreVal = row.querySelector('.fx-home-score').value;
      const awayScoreVal = row.querySelector('.fx-away-score').value;
      updated.push({
        ...existing,
        id,
        date: dateStr ? new Date(`${dateStr}T${timeStr}:00`).toISOString() : existing.date,
        status,
        venue: existing.venue ?? (isHome ? 'Stadium of Light' : null),
        competition,
        round: round || null,
        homeTeam: isHome ? club : opponent,
        awayTeam: isHome ? opponent : club,
        isHome,
        homeScore: homeScoreVal === '' ? null : Number(homeScoreVal),
        awayScore: awayScoreVal === '' ? null : Number(awayScoreVal),

    });
    updated.sort((a, b) => new Date(a.date) - new Date(b.date));

    try {
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/fixtures.json', content: state.fixtures, message: 'Manual fixtures edit from app' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      el('manageFixturesStatus').textContent = 'Saved.';
      el('manageFixturesStatus').className = 'status ok';
      renderFixturesList();

      el('manageFixturesStatus').textContent = `Failed: ${err.message}`;
      el('manageFixturesStatus').className = 'status err';

  el('manageMatchStatsBtn').onclick = () => {
    const area = el('manageMatchStatsArea');

    if (!isOpen) renderManageMatchStats();

    ['none', 'Did not feature'],

    ['sub', 'Sub appearance'],
    ['unused', 'Unused sub'],
  ];

  // Which fixture's stats are currently being edited — kept outside state

  let matchStatsSelectedFixture = null;

  function renderManageMatchStats() {
    const area = el('manageMatchStatsArea');
    const sortedFixtures = state.fixtures.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!sortedFixtures.length) {
      area.innerHTML = '<div class="empty">Add fixtures first, then come back here.</div>';

      matchStatsSelectedFixture = sortedFixtures[0].id;
    }

    const fixtureOptions = sortedFixtures.map(f => {
      const opponent = f.isHome ? f.awayTeam : f.homeTeam;
      const venueTag = f.isHome ? 'H' : 'A';
      const scoreTag = ['FT', 'AET', 'PEN'].includes(f.status) ? ` (${f.homeScore}-${f.awayScore})` : '';

      <button class="primary" style="background:var(--ink);margin-top:8px;" onclick="fillMatchStatsFromJson()">Fill table from JSON</button>
      <div id="msJsonStatus" class="status"></div>

      updateMatchStatsSaveConfirm();

  // A highly visible reminder of exactly which fixture "Save" will write to —
  // added after a mix-up where a second match's stats were saved under the
  // first match's id because the dropdown selection wasn't re-checked before

  function updateMatchStatsSaveConfirm() {
    const matchId = matchStatsSelectedFixture;

    const box = el('msSaveConfirm');
    if (!box) return;
    if (!fixture) { box.textContent = 'No fixture selected.'; return; }
    const opponent = fixture.isHome ? fixture.awayTeam : fixture.homeTeam;
    const venueTag = fixture.isHome ? 'H' : 'A';
    box.innerHTML = `Saving to: <span style="color:var(--safc-red);">${formatFixtureDate(fixture.date).split(',')[0]} · ${venueTag} vs ${escapeHtml(opponent)}</span> — check this is the right match before saving.`;
  }

      state.matchStats.filter(r => r.matchId === matchId).map(r => [r.playerId, r])

    container.innerHTML = eligible.map(p => {
      const r = existingByPlayer.get(p.id) || {};
      const appearance = r.appearance || 'none';
      return `
        <div class="edit-row" data-player-id="${p.id}" data-player-name="${escapeHtml(p.name)}">

              <label class="field-label">Red</label>
              <input type="number" class="ms-red" value="${r.redCards ?? 0}" min="0" max="1" />
            </div>
          </div>
          <div class="edit-row-fields">
            <div class="field-group">
              <label class="field-label">Sub on (min)</label>
              <input type="number" class="ms-sub-on" value="${r.subOnMinute ?? ''}" placeholder="—" min="0" max="120" />
            </div>
            <div class="field-group">
              <label class="field-label">Sub off (min)</label>
              <input type="number" class="ms-sub-off" value="${r.subOffMinute ?? ''}" placeholder="—" min="0" max="120" />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Notes</label>
            <input type="text" class="ms-notes" value="${escapeHtml(r.notes || '')}" placeholder="Optional" />
          </div>
        </div>
      `;
    }).join('');
  }

  window.fillMatchStatsFromJson = () => {
    const raw = el('msJsonPaste').value.trim();
    if (!raw) return;
    let parsed;
    try {
      parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Expected a JSON array');
    } catch (err) {
      el('msJsonStatus').textContent = `Invalid JSON: ${err.message}`;
      el('msJsonStatus').className = 'status err';
      return;
    }

    let matched = 0;
    const unmatched = [];
    const ambiguous = [];
    parsed.forEach(rec => {
      let row = null;
      const rows = Array.from(el('msPlayerRows').querySelectorAll('.edit-row'));

      if (rec.playerId) {
        row = rows.find(r => r.dataset.playerId === rec.playerId);
      }
      if (!row && rec.name) {
        // Strip accents before comparing — "Fée" vs "Fee", "Núñez" vs "Nunez"
        // shouldn't fail to match just because one side has diacritics and
        // the other doesn't; neither Claude's guess nor Tim's own typing is
        // reliably consistent about this.
        const normalize = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const target = normalize(String(rec.name).toLowerCase().trim());
        // 1. exact full-name match
        row = rows.find(r => normalize(r.dataset.playerName.toLowerCase().trim()) === target);

        // 2. fallback: match by surname only. Claude doesn't have visibility
        // into how names are actually entered in Manage Squad (full name vs
        // "T. Meunier" style vs anything else), and that can change as the
        // squad changes — matching on the last word only is far more
        // resilient to that than requiring an exact full-string match.
        // Only auto-applies when exactly one player shares that surname.
        if (!row) {
          const targetSurname = target.split(/\s+/).pop();
          const surnameMatches = rows.filter(r =>
            normalize(r.dataset.playerName.toLowerCase().trim()).split(/\s+/).pop() === targetSurname
          );
          if (surnameMatches.length === 1) {
            row = surnameMatches[0];
          } else if (surnameMatches.length > 1) {
            ambiguous.push(`${rec.name} (could be: ${surnameMatches.map(r => r.dataset.playerName).join(' / ')})`);
            return;
          } else {
            // 3. fallback: match by first name / mononym. Some players go by
            // their first name professionally (e.g. Reinildo, for Reinildo
            // Mandava) rather than their surname — surname matching alone
            // would never find these, so try the first word too. Same
            // ambiguity rule: only auto-applies if exactly one match.
            const targetFirst = target.split(/\s+/)[0];
            const firstNameMatches = rows.filter(r =>
              normalize(r.dataset.playerName.toLowerCase().trim()).split(/\s+/)[0] === targetFirst
            );
            if (firstNameMatches.length === 1) {
              row = firstNameMatches[0];
            } else if (firstNameMatches.length > 1) {
              ambiguous.push(`${rec.name} (could be: ${firstNameMatches.map(r => r.dataset.playerName).join(' / ')})`);
              return;
            }
          }
        }
      }
      if (!row) { unmatched.push(rec.playerId || rec.name || '?'); return; }

      row.querySelector('.ms-appearance').value = rec.appearance || 'start';
      row.querySelector('.ms-minutes').value = rec.minutes ?? '';
      row.querySelector('.ms-rating').value = rec.rating ?? '';
      row.querySelector('.ms-goals').value = rec.goals ?? 0;
      row.querySelector('.ms-assists').value = rec.assists ?? 0;
      row.querySelector('.ms-yellow').value = rec.yellowCards ?? 0;
      row.querySelector('.ms-red').value = rec.redCards ?? 0;
      row.querySelector('.ms-sub-on').value = rec.subOnMinute ?? '';
      row.querySelector('.ms-sub-off').value = rec.subOffMinute ?? '';
      row.querySelector('.ms-notes').value = rec.notes || '';
      matched++;
    });

    const problems = [];
    if (unmatched.length) problems.push(`Couldn't match: ${unmatched.join(', ')}`);
    if (ambiguous.length) problems.push(`Ambiguous (please fill by hand): ${ambiguous.join('; ')}`);
    el('msJsonStatus').textContent = problems.length
      ? `Filled ${matched} row(s). ${problems.join(' ')}`
      : `Filled ${matched} row(s) from JSON. Review below, then Save.`;
    el('msJsonStatus').className = problems.length ? 'status err' : 'status ok';
  };

  // Wipes every match-stats record for every fixture — deliberately blunt (no
  // per-match option) since its job is clearing out test/dummy data in one go,
  // both now (recovering from a mix-up) and later (right before kickoff).
  window.resetAllMatchStats = async () => {
    const sure = confirm('This permanently deletes ALL match stats for every fixture, not just the one currently selected. This cannot be undone. Continue?');
    if (!sure) return;
    const pin = el('ownerPin').value;
    el('manageMatchStatsStatus').textContent = 'Resetting…';
    el('manageMatchStatsStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/match-stats.json', content: [], message: 'Reset all match stats' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Reset failed');
      state.matchStats = [];
      renderMatchStatsPlayerRows();
      el('manageMatchStatsStatus').textContent = 'All match stats cleared. Start fresh from here.';
      el('manageMatchStatsStatus').className = 'status ok';
    } catch (err) {
      el('manageMatchStatsStatus').textContent = `Reset failed: ${err.message}`;
      el('manageMatchStatsStatus').className = 'status err';
    }
  };

  window.saveMatchStats = async () => {
    const matchId = matchStatsSelectedFixture;
    if (!matchId) return;
    const rows = el('msPlayerRows').querySelectorAll('.edit-row');
    const records = [];
    rows.forEach(row => {
      const appearance = row.querySelector('.ms-appearance').value;
      if (appearance === 'none') return; // not involved in this match — nothing to save
      const minutesVal = row.querySelector('.ms-minutes').value;
      const ratingVal = row.querySelector('.ms-rating').value;
      const subOnVal = row.querySelector('.ms-sub-on').value;
      const subOffVal = row.querySelector('.ms-sub-off').value;
      records.push({
        playerId: row.dataset.playerId,
        appearance,
        minutes: minutesVal === '' ? 0 : Number(minutesVal),
        goals: Number(row.querySelector('.ms-goals').value || 0),
        assists: Number(row.querySelector('.ms-assists').value || 0),
        yellowCards: Number(row.querySelector('.ms-yellow').value || 0),
        redCards: Number(row.querySelector('.ms-red').value || 0),
        rating: ratingVal === '' ? null : Number(ratingVal),
        subOnMinute: subOnVal === '' ? null : Number(subOnVal),
        subOffMinute: subOffVal === '' ? null : Number(subOffVal),
        notes: row.querySelector('.ms-notes').value.trim() || null,
      });
    });

    const pin = el('ownerPin').value;
    el('manageMatchStatsStatus').textContent = 'Saving…';
    el('manageMatchStatsStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/save-match-stats`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ matchId, records }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      state.matchStats = state.matchStats
        .filter(r => r.matchId !== matchId)
        .concat(records.map(r => ({ id: `ms_${matchId}_${r.playerId}`, matchId, ...r })));
      el('manageMatchStatsStatus').textContent = `Saved — ${records.length} player record(s) for this match.`;
      el('manageMatchStatsStatus').className = 'status ok';
    } catch (err) {
      el('manageMatchStatsStatus').textContent = `Failed: ${err.message}`;
      el('manageMatchStatsStatus').className = 'status err';
    }
  };

  el('findTeamBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('findTeamResults').innerHTML = 'Searching…';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/find-team?name=Sunderland`, {
        headers: { 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed');
      el('findTeamResults').innerHTML = (data.teams || []).map(t => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
          <span>${escapeHtml(t.name)} (${escapeHtml(t.country)}) — ID ${t.teamId}</span>
          <button class="primary" style="width:auto;padding:8px 12px;margin:0;" onclick="saveTeamId(${t.teamId})">Use this one</button>
        </div>
      `).join('') || '<div class="empty">No teams found</div>';
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  window.saveTeamId = async (teamId) => {
    const pin = el('ownerPin').value;
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/set-team`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ teamId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to save team');
      el('findTeamResults').innerHTML = `<div class="status ok">Saved team ID ${teamId}. Now tap "Sync squad".</div>`;
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  el('syncSquadBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('syncSquadBtn').disabled = true;
    el('syncStatus').textContent = 'Syncing…';
    el('syncStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/sync-squad`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sync failed');
      if (data.diagnostic) {
        el('syncStatus').textContent = `${data.diagnostic.message} (API results: ${data.diagnostic.apiResults})`;
        el('syncStatus').className = 'status err';
      } else {
        el('syncStatus').textContent = `Done — ${data.added} added, ${data.updated} updated, ${data.total} total players.`;
        el('syncStatus').className = 'status ok';
      }
    } catch (err) {
      el('syncStatus').textContent = `Failed: ${err.message}`;
      el('syncStatus').className = 'status err';
    } finally {
      el('syncSquadBtn').disabled = false;
    }
  };
  } // end wireAdminHandlers

  el('switchLink').onclick = (e) => {
    e.preventDefault();
    state.name = null;
    localStorage.removeItem('safc_name');
    el('signedInArea').style.display = 'none';
    el('pickerCard').style.display = 'block';
  };

  el('postCommentBtn').onclick = async () => {
    const text = el('commentText').value.trim();
    if (!text) return;
    el('postCommentBtn').disabled = true;
    el('commentStatus').textContent = 'Posting…';
    el('commentStatus').className = 'status';
    try {
      await apiPost('/api/comment', { name: state.name, text });
      el('commentText').value = '';
      el('commentStatus').textContent = 'Posted.';
      el('commentStatus').className = 'status ok';
      loadComments();
    } catch (err) {
      el('commentStatus').textContent = `Failed: ${err.message}`;
      el('commentStatus').className = 'status err';
    } finally {
      el('postCommentBtn').disabled = false;
    }
  };

  async function loadComments() {
    try {
      state.comments = await apiGet('data/comments.json') || [];
      const list = el('commentsList');
      if (!state.comments.length) {
        list.innerHTML = '<div class="empty">No comments yet</div>';
        return;
      }
      const isOwner = state.config && state.name === state.config.owner;
      list.innerHTML = state.comments.slice().reverse().map(c => `
        <div class="comment">
          <div class="meta">
            <b>${escapeHtml(c.name)}</b> · ${new Date(c.timestamp).toLocaleString()}
            ${isOwner ? ` · <a href="#" style="color:var(--safc-red);" onclick="deleteComment('${c.id}');return false;">delete</a>` : ''}
          </div>
          <div>${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    } catch (err) {
      el('commentsList').innerHTML = `<div class="empty">Couldn't load comments (${err.message})</div>`;
    }
  }

  window.deleteComment = async (id) => {
    const pin = prompt('Enter owner PIN to delete this comment:');
    if (!pin) return;
    try {
      const remaining = state.comments.filter(c => c.id !== id);
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/comments.json', content: remaining, message: 'Delete comment from app' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');
      loadComments();
    } catch (err) {
      alert(`Failed to delete: ${err.message}`);
    }
  };

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  init();
</script>
</body>
</html>
