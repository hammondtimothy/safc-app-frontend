<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAFC Player Ratings</title>

<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#EB172B" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --safc-red: #EB172B;
    --safc-red-dark: #B8101F;
    --ink: #14110F;
    --paper: #F7F5F2;
    --card: #FFFFFF;
    --line: #E4E0D9;
    --muted: #6B6560;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header.top {
    background: var(--safc-red);
    color: white;
    padding: calc(env(safe-area-inset-top) + 18px) 20px 22px;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute;
    top: 0; right: -10%;
    width: 40%; height: 100%;
    background: rgba(255,255,255,0.08);
    transform: skewX(-12deg);
  }
  header.top h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0;
    text-transform: uppercase;
  }
  header.top p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--safc-red);
    margin: 0 0 10px;
  }
  .name-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .name-btn {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .name-btn:active { background: var(--safc-red); color: white; border-color: var(--safc-red); }

  .whoami {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
  }
  .whoami b { color: var(--ink); }
  .switch-link {
    color: var(--safc-red);
    font-weight: 600;
    text-decoration: none;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    min-height: 70px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    resize: vertical;
  }
  button.primary {
    margin-top: 10px;
    background: var(--safc-red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }
  button.primary:active { background: var(--safc-red-dark); }
  button.primary:disabled { opacity: 0.5; }

  .comment {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .comment:last-child { border-bottom: none; }
  .comment .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .comment .meta b { color: var(--ink); }
  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
  }
  .status {
    font-size: 13px;
    margin-top: 8px;
  }
  .status.ok { color: #157F3B; }
  .status.err { color: var(--safc-red); }

  .status-group { margin-bottom: 20px; }
  .status-group:last-child { margin-bottom: 0; }
  .status-group-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--safc-red);
    margin: 0 0 10px;
  }
  .position-group { margin-bottom: 14px; }
  .position-group:last-child { margin-bottom: 0; }
  .position-group h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    cursor: pointer;
  }
  .player-row:active { background: var(--paper); }
  .player-row:last-child { border-bottom: none; }
  .player-row .num {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 26px;
    flex-shrink: 0;
  }
  .player-row .name { flex: 1; padding: 0 8px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .badge.squad { background: #E7F5EC; color: #157F3B; }
  .badge.loan { background: #FFF4E0; color: #A8630A; }
  .badge.academy { background: #E9EEFB; color: #2C4FA6; }
  .badge.left { background: #F1EFEB; color: var(--muted); }

  /* Player detail overlay */
  .player-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 100;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }
  .player-overlay.open { transform: translateX(0); }
  .player-overlay-header {
    background: var(--safc-red);
    color: white;
    padding: calc(env(safe-area-inset-top) + 16px) 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .player-overlay-back {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .player-overlay-header h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .player-overlay-header p {
    margin: 2px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .player-overlay-body { max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; }

  .player-photo-block { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .player-photo, .player-photo-fallback {
    width: 68px; height: 68px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid var(--line);
  }
  .player-photo-fallback {
    display: flex; align-items: center; justify-content: center;
    background: var(--safc-red);
    color: white;
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
  }
  .player-meta-line { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 4px;
  }
  .stat-cell {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-cell .val {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    color: var(--ink);
  }
  .stat-cell .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .bio-text { font-size: 14px; line-height: 1.55; white-space: pre-line; }

  .match-history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .match-history-row:last-child { border-bottom: none; }
  .mh-opponent { font-weight: 600; font-size: 14px; }
  .mh-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mh-extras { font-size: 12px; margin-top: 2px; }
  .mh-rating {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    flex-shrink: 0;
    padding-left: 10px;
    font-variant-numeric: tabular-nums;
  }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .edit-row input, .edit-row select {
    width: 100%;
    padding: 8px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .edit-row-fields { display: flex; gap: 6px; }
  .edit-row-fields input:first-child { width: 54px; flex-shrink: 0; }
  .field-group { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
  }
  .remove-player-link {
    color: var(--safc-red);
    font-size: 12px;
    text-decoration: none;
    align-self: flex-end;
  }

  .fixture-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .fixture-row:last-child { border-bottom: none; }
  .fixture-row .comp {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  .fixture-row .match-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3px;
  }
  .fixture-row .teams { font-weight: 600; }
  .fixture-row .datetime { color: var(--muted); font-size: 13px; }
  .fixture-row .score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<header class="top">
  <h1>SAFC Player Ratings</h1>
  <p id="seasonLabel">Loading season…</p>
</header>

<main>

  <!-- Stage 0 status card -->
  <div class="card" id="setupCard">
    <p class="eyebrow">Stage 0 check</p>
    <div id="setupStatus" class="status">Checking connection to the backend…</div>
  </div>

  <!-- Name picker -->
  <div class="card" id="pickerCard" style="display:none;">
    <p class="eyebrow">Who's this?</p>
    <div class="name-grid" id="nameGrid"></div>
  </div>

  <!-- Signed-in view -->
  <div id="signedInArea" style="display:none;">
    <div class="card">
      <div class="whoami">
        <span>Signed in as <b id="currentName"></b></span>
        <a href="#" class="switch-link" id="switchLink">Not you?</a>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">Test comment</p>
      <textarea id="commentText" placeholder="Say something about the Lads…"></textarea>
      <button class="primary" id="postCommentBtn">Post comment</button>
      <div id="commentStatus" class="status"></div>
    </div>

    <div class="card">
      <p class="eyebrow">Recent comments</p>
      <div id="commentsList"><div class="empty">No comments yet</div></div>
    </div>

    <div class="card">
      <p class="eyebrow">Fixtures</p>
      <div id="fixturesList"><div class="empty">Loading fixtures…</div></div>
    </div>

    <div class="card">
      <p class="eyebrow">Squad</p>
      <div id="squadList"><div class="empty">Loading squad…</div></div>
    </div>

    <div class="card" id="ownerToolsCard" style="display:none;">
      <p class="eyebrow">Owner tools</p>
      <input type="password" id="ownerPin" placeholder="Owner PIN" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:10px;" />

      <button class="primary" id="findTeamBtn" style="background:var(--ink);">Find Sunderland's team ID</button>
      <div id="findTeamResults" style="margin-top:10px;"></div>

      <button class="primary" id="syncSquadBtn" style="margin-top:14px;background:var(--ink);">Sync squad from API-Football</button>
      <div id="syncStatus" class="status"></div>

      <button class="primary" id="manageSquadBtn" style="margin-top:14px;">Manage squad</button>
      <div id="manageSquadArea" style="margin-top:12px;display:none;"></div>
      <div id="manageStatus" class="status"></div>

      <button class="primary" id="manageFixturesBtn" style="margin-top:14px;">Manage fixtures</button>
      <div id="manageFixturesArea" style="margin-top:12px;display:none;"></div>
      <div id="manageFixturesStatus" class="status"></div>

      <button class="primary" id="manageMatchStatsBtn" style="margin-top:14px;">Manage match stats</button>
      <div id="manageMatchStatsArea" style="margin-top:12px;display:none;"></div>
      <div id="manageMatchStatsStatus" class="status"></div>
    </div>
  </div>

</main>

<!-- Player detail overlay (Stage 4) -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-overlay-header">
    <button class="player-overlay-back" id="playerOverlayBack" aria-label="Back">&larr;</button>
    <div>
      <h2 id="playerOverlayName">&nbsp;</h2>
      <p id="playerOverlaySub">&nbsp;</p>
    </div>
  </div>
  <div class="player-overlay-body" id="playerOverlayBody"></div>
</div>

<script src="config.js"></script>
<script>
  const state = { name: localStorage.getItem('safc_name') || null, config: null, players: [], comments: [], fixtures: [], matchStats: [] };

  const COUNTRIES = [
    ["England","GB-ENG"],["Scotland","GB-SCT"],["Wales","GB-WLS"],["Northern Ireland","GB-NIR"],
    ["Republic of Ireland","IE"],["France","FR"],["Germany","DE"],["Netherlands","NL"],["Belgium","BE"],
    ["Portugal","PT"],["Spain","ES"],["Italy","IT"],["Switzerland","CH"],["Austria","AT"],["Denmark","DK"],
    ["Norway","NO"],["Sweden","SE"],["Finland","FI"],["Iceland","IS"],["Poland","PL"],["Czech Republic","CZ"],
    ["Slovakia","SK"],["Hungary","HU"],["Romania","RO"],["Croatia","HR"],["Serbia","RS"],["Slovenia","SI"],
    ["Bosnia and Herzegovina","BA"],["Montenegro","ME"],["North Macedonia","MK"],["Albania","AL"],["Kosovo","XK"],
    ["Greece","GR"],["Turkey","TR"],["Ukraine","UA"],["Russia","RU"],["Ghana","GH"],["Nigeria","NG"],
    ["Senegal","SN"],["Ivory Coast","CI"],["Mali","ML"],["Guinea","GN"],["DR Congo","CD"],["Cameroon","CM"],
    ["Morocco","MA"],["Algeria","DZ"],["Tunisia","TN"],["Egypt","EG"],["South Africa","ZA"],["Brazil","BR"],
    ["Argentina","AR"],["Uruguay","UY"],["Paraguay","PY"],["Colombia","CO"],["Chile","CL"],["USA","US"],
    ["Canada","CA"],["Jamaica","JM"],["Trinidad and Tobago","TT"],["Australia","AU"],["Japan","JP"],
    ["South Korea","KR"],["Iran","IR"],["Israel","IL"],
  ];

  // Real flag emoji work reliably everywhere, but England/Scotland/Wales use a
  // special multi-part Unicode sequence with inconsistent device support — when
  // unsupported it silently falls back to a plain black flag. Rather than rely
  // on that (or a text-only badge), those three get a small hand-drawn inline
  // SVG flag instead, sized to sit inline with the emoji flags used elsewhere.
  const HOME_NATION_FLAG_SVGS = {
    'GB-ENG': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="36" fill="#FFFFFF"/>
      <rect x="24" width="12" height="36" fill="#CE1124"/>
      <rect y="12" width="60" height="12" fill="#CE1124"/>
    </svg>`,
    'GB-SCT': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="36" fill="#005EB8"/>
      <polygon points="0,0 8,0 60,32 60,36 52,36 0,4" fill="#FFFFFF"/>
      <polygon points="60,0 52,0 0,32 0,36 8,36 60,4" fill="#FFFFFF"/>
    </svg>`,
    'GB-WLS': `<svg viewBox="0 0 60 36" width="1.5em" height="0.9em" style="vertical-align:-0.1em;flex-shrink:0;">
      <rect width="60" height="18" fill="#FFFFFF"/>
      <rect y="18" width="60" height="18" fill="#00843D"/>
      <path d="M18,26 C14,24 13,19 16,16 C14,14 15,10 19,10 C20,7 24,6 27,8
               C29,6 33,7 33,10 C37,9 40,12 38,15 C41,16 41,20 38,21
               C39,24 36,27 32,25 C31,28 26,29 24,26 C22,28 19,28 18,26 Z"
            fill="#C8102E"/>
      <path d="M33,10 L41,5 L38,12 Z" fill="#C8102E"/>
      <path d="M16,16 L8,13 L14,20 Z" fill="#C8102E"/>
      <path d="M27,20 L24,24" stroke="#C8102E" stroke-width="1.5" fill="none"/>
    </svg>`,
  };

  function flagEmoji(code) {
    if (!code) return '';
    if (HOME_NATION_FLAG_SVGS[code]) return HOME_NATION_FLAG_SVGS[code];
    if (code === 'GB-NIR') return '🇬🇧';
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  // Plain-text-only version for use inside <option> tags, which can't render
  // SVG/HTML at all — this stays text-only regardless of the fix above.
  function flagText(code) {
    if (!code) return '';
    if (code === 'GB-ENG') return 'ENG';
    if (code === 'GB-SCT') return 'SCO';
    if (code === 'GB-WLS') return 'WAL';
    if (code === 'GB-NIR') return '🇬🇧';
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  const el = (id) => document.getElementById(id);

  async function apiGet(file) {
    const res = await fetch(`${WORKER_URL}/api/data?file=${encodeURIComponent(file)}`);
    if (!res.ok) throw new Error(`Read failed (${res.status})`);
    return (await res.json()).content;
  }

  async function apiPost(path, body) {
    const res = await fetch(`${WORKER_URL}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    return res.json();
  }

  async function init() {
    if (!WORKER_URL || WORKER_URL.startsWith('REPLACE')) {
      el('setupStatus').textContent = 'config.js still has the placeholder Worker URL — edit it with your real Worker URL.';
      el('setupStatus').className = 'status err';
      return;
    }
    try {
      const health = await fetch(`${WORKER_URL}/api/health`).then(r => r.json());
      if (!health.ok) throw new Error('Backend did not report healthy');

      const config = await apiGet('data/config.json');
      state.config = config || { season: 'unknown', names: [] };
      el('seasonLabel').textContent = `${state.config.club || 'Sunderland AFC'} · ${state.config.season} season`;

      el('setupStatus').textContent = 'Connected to backend and repo successfully.';
      el('setupStatus').className = 'status ok';
      el('setupCard').style.display = 'none'; // hide once healthy, keeps the app clean day-to-day

      renderNamePicker();
      if (state.name) showSignedIn();
    } catch (err) {
      el('setupStatus').textContent = `Connection failed: ${err.message}. Check the Worker URL in config.js and that the Worker is deployed.`;
      el('setupStatus').className = 'status err';
    }
  }

  function renderNamePicker() {
    const grid = el('nameGrid');
    grid.innerHTML = '';
    (state.config.names || []).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.textContent = name;
      btn.onclick = () => {
        state.name = name;
        localStorage.setItem('safc_name', name);
        showSignedIn();
      };
      grid.appendChild(btn);
    });
    el('pickerCard').style.display = state.name ? 'none' : 'block';
  }

  function showSignedIn() {
    el('pickerCard').style.display = 'none';
    el('signedInArea').style.display = 'block';
    el('currentName').textContent = state.name;
    loadComments();
    loadSquad();
    loadFixtures();
    loadMatchStats();
    if (state.config && state.name === state.config.owner) {
      el('ownerToolsCard').style.display = 'block';
    }
  }

  const POSITION_ORDER = ['GK', 'DEF', 'MID', 'FWD'];
  const POSITION_LABELS = { GK: 'Goalkeepers', DEF: 'Defenders', MID: 'Midfielders', FWD: 'Forwards' };
  // Squad first (most likely to feature), then loan/academy (rarely feature but
  // still worth having to hand), left last — avoids scrolling past fringe
  // players to find who's actually going to play week to week.
  const STATUS_GROUPS = [
    ['squad', 'First-team squad'],
    ['loan', 'On loan'],
    ['academy', 'Academy'],
    ['left', 'Departed'],
  ];

  async function loadSquad() {
    try {
      state.players = await apiGet('data/players.json') || [];
      renderSquadList();
    } catch (err) {
      el('squadList').innerHTML = `<div class="empty">Couldn't load squad (${err.message})</div>`;
    }
  }

  function renderSquadList() {
    const container = el('squadList');
    if (!state.players.length) {
      container.innerHTML = '<div class="empty">No players yet</div>';
      return;
    }
    container.innerHTML = STATUS_GROUPS.map(([status, statusLabel]) => {
      const inStatus = state.players.filter(p => (p.status || 'squad') === status);
      if (!inStatus.length) return '';
      const positionBlocks = POSITION_ORDER.map(pos => {
        const players = inStatus
          .filter(p => p.position === pos)
          .sort((a, b) => (a.squadNumber ?? 999) - (b.squadNumber ?? 999));
        if (!players.length) return '';

            <span class="badge ${p.status}">${p.status}</span>
          </div>
        `).join('');
        return `<div class="position-group"><h4>${POSITION_LABELS[pos]}</h4>${rows}</div>`;
      }).join('');
      return `<div class="status-group"><p class="status-group-header">${escapeHtml(statusLabel)}</p>${positionBlocks}</div>`;
    }).join('');

  // ---- Player detail overlay (Stage 4) ----

  // Player initials for the photo fallback badge, e.g. "A. Patterson" -> "AP".
  function playerInitials(name) {
    if (!name) return '?';
    const parts = name.replace(/\./g, '').split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // Season stats are never stored — always recomputed from data/match-stats.json
  // plus data/fixtures.json, so corrections to either source are reflected
  // immediately without any separate "recalculate" step.
  function computeSeasonStats(player) {
    const records = state.matchStats.filter(r => r.playerId === player.id);
    const appeared = records.filter(r => r.appearance === 'start' || r.appearance === 'sub');

    const sum = (key) => appeared.reduce((total, r) => total + (r[key] || 0), 0);
    const ratings = appeared.map(r => r.rating).filter(r => r !== null && r !== undefined);
    const avgRating = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null;

    const stats = {
      appearances: appeared.length,
      starts: records.filter(r => r.appearance === 'start').length,
      subApps: records.filter(r => r.appearance === 'sub').length,
      minutes: sum('minutes'),
      goals: sum('goals'),
      assists: sum('assists'),
      yellowCards: sum('yellowCards'),
      redCards: sum('redCards'),
      avgRating,
      cleanSheets: null,
      goalsConceded: null,
    };

    if (player.position === 'GK' || player.position === 'DEF') {
      let cleanSheets = 0;
      let goalsConceded = 0;
      appeared.forEach(r => {
        const fixture = state.fixtures.find(f => f.id === r.matchId);
        if (!fixture || !['FT', 'AET', 'PEN'].includes(fixture.status)) return;
        const conceded = fixture.isHome ? fixture.awayScore : fixture.homeScore;
        if (conceded === null || conceded === undefined) return;
        goalsConceded += conceded;
        if (conceded === 0) cleanSheets++;
      });
      stats.cleanSheets = cleanSheets;
      stats.goalsConceded = goalsConceded;
    }

    return stats;
  }

  function statCell(value, label) {
    const display = (value === null || value === undefined) ? '—' : value;
    return `<div class="stat-cell"><div class="val">${display}</div><div class="lbl">${label}</div></div>`;
  }

  // Match-by-match ratings — average rating alone can hide a run of poor
  // matches offset by one standout one, so this surfaces the actual spread.
  // Chronological (oldest first), each row tied back to its fixture for the
  // opponent/scoreline, since match-stats records don't duplicate that data.
  function buildMatchHistoryRows(player) {
    const records = state.matchStats.filter(r => r.playerId === player.id);
    const withFixture = records
      .map(r => ({ r, fixture: state.fixtures.find(f => f.id === r.matchId) }))
      .filter(x => x.fixture);
    withFixture.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));

    if (!withFixture.length) {
      return '<div class="empty">No matches recorded yet.</div>';
    }

    return withFixture.map(({ r, fixture }) => {
      const opponent = fixture.isHome ? fixture.awayTeam : fixture.homeTeam;
      const venueTag = fixture.isHome ? 'H' : 'A';
      const scoreOrDate = ['FT', 'AET', 'PEN'].includes(fixture.status)
        ? `${fixture.homeScore}-${fixture.awayScore}`
        : formatFixtureDate(fixture.date).split(',')[0];

      const involvementLabel = r.appearance === 'start'
        ? 'Started'
        : r.appearance === 'sub'
          ? `Sub (on ${r.subOnMinute ?? '?'}')`
          : 'Unused sub';

      const extras = [];
      if (r.goals) extras.push(`${r.goals} ⚽`);
      if (r.assists) extras.push(`${r.assists} 🅰️`);
      if (r.yellowCards) extras.push('🟨'.repeat(r.yellowCards));
      if (r.redCards) extras.push('🟥');

      const ratingDisplay = (r.rating !== null && r.rating !== undefined) ? r.rating.toFixed(1) : '—';

      return `
        <div class="match-history-row">
          <div>
            <div class="mh-opponent">${venueTag} vs ${escapeHtml(opponent)}</div>
            <div class="mh-meta">${scoreOrDate} · ${involvementLabel}${r.minutes ? ' · ' + r.minutes + "'" : ''}</div>
            ${extras.length ? `<div class="mh-extras">${extras.join(' ')}</div>` : ''}
          </div>
          <div class="mh-rating">${ratingDisplay}</div>
        </div>
      `;
    }).join('');
  }

    return { dateStr, timeStr, opponent };

      <div id="msPlayerRows"></div>

      <div id="msSaveConfirm" style="margin-top:14px;padding:10px 12px;background:var(--paper);border:1.5px solid var(--safc-red);border-radius:10px;font-size:13px;font-weight:600;"></div>
      <button class="primary" style="margin-top:8px;" onclick="saveMatchStats()">Save match stats</button>

      <a href="#" class="remove-player-link" style="display:block;text-align:center;margin-top:16px;" onclick="resetAllMatchStats();return false;">Reset ALL match stats (wipes every match — use for clearing test data)</a>
    `;

    updateMatchStatsSaveConfirm();

    el('msFixtureSelect').onchange = (e) => {
      matchStatsSelectedFixture = e.target.value;
      renderMatchStatsPlayerRows();
      updateMatchStatsSaveConfirm();
    };

    renderMatchStatsPlayerRows();
  }

  // A highly visible reminder of exactly which fixture "Save" will write to —
  // added after a mix-up where a second match's stats were saved under the
  // first match's id because the dropdown selection wasn't re-checked before
  // hitting Save.
  function updateMatchStatsSaveConfirm() {
    const matchId = matchStatsSelectedFixture;
    const fixture = state.fixtures.find(f => f.id === matchId);
    const box = el('msSaveConfirm');
    if (!box) return;
    if (!fixture) { box.textContent = 'No fixture selected.'; return; }
    const opponent = fixture.isHome ? fixture.awayTeam : fixture.homeTeam;
    const venueTag = fixture.isHome ? 'H' : 'A';
    box.innerHTML = `Saving to: <span style="color:var(--safc-red);">${formatFixtureDate(fixture.date).split(',')[0]} · ${venueTag} vs ${escapeHtml(opponent)}</span> — check this is the right match before saving.`;
  }

  function renderMatchStatsPlayerRows() {
    const matchId = matchStatsSelectedFixture;
    const container = el('msPlayerRows');
    if (!matchId) { container.innerHTML = ''; return; }

    const eligible = state.players
      .filter(p => p.status !== 'left')
      .sort((a, b) => (a.squadNumber ?? 999) - (b.squadNumber ?? 999));
    const existingByPlayer = new Map(
      state.matchStats.filter(r => r.matchId === matchId).map(r => [r.playerId, r])
    );

    container.innerHTML = eligible.map(p => {
      const r = existingByPlayer.get(p.id) || {};
      const appearance = r.appearance || 'none';
      return `
        <div class="edit-row" data-player-id="${p.id}" data-player-name="${escapeHtml(p.name)}">
          <div style="font-weight:600;font-size:13px;">${p.squadNumber ?? '—'} · ${escapeHtml(p.name)}</div>
          <div class="edit-row-fields">
            <div class="field-group">
              <label class="field-label">Involvement</label>
              <select class="ms-appearance">
                ${APPEARANCE_OPTIONS.map(([v, l]) => `<option value="${v}" ${appearance === v ? 'selected' : ''}>${l}</option>`).join('')}
              </select>
            </div>
            <div class="field-group">
              <label class="field-label">Minutes</label>
              <input type="number" class="ms-minutes" value="${r.minutes ?? ''}" placeholder="0" min="0" max="120" />
            </div>
            <div class="field-group">
              <label class="field-label">Rating</label>
              <input type="number" class="ms-rating" value="${r.rating ?? ''}" placeholder="—" step="0.1" min="0" max="10" />
            </div>
          </div>
          <div class="edit-row-fields">
            <div class="field-group">
              <label class="field-label">Goals</label>
              <input type="number" class="ms-goals" value="${r.goals ?? 0}" min="0" />
            </div>
            <div class="field-group">
              <label class="field-label">Assists</label>
              <input type="number" class="ms-assists" value="${r.assists ?? 0}" min="0" />
            </div>
            <div class="field-group">
              <label class="field-label">Yellow</label>
              <input type="number" class="ms-yellow" value="${r.yellowCards ?? 0}" min="0" max="2" />
            </div>
            <div class="field-group">
              <label class="field-label">Red</label>
              <input type="number" class="ms-red" value="${r.redCards ?? 0}" min="0" max="1" />
            </div>
          </div>
          <div class="edit-row-fields">
            <div class="field-group">
              <label class="field-label">Sub on (min)</label>
              <input type="number" class="ms-sub-on" value="${r.subOnMinute ?? ''}" placeholder="—" min="0" max="120" />
            </div>
            <div class="field-group">
              <label class="field-label">Sub off (min)</label>
              <input type="number" class="ms-sub-off" value="${r.subOffMinute ?? ''}" placeholder="—" min="0" max="120" />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Notes</label>
            <input type="text" class="ms-notes" value="${escapeHtml(r.notes || '')}" placeholder="Optional" />
          </div>
        </div>
      `;
    }).join('');
  }

  window.fillMatchStatsFromJson = () => {
    const raw = el('msJsonPaste').value.trim();
    if (!raw) return;
    let parsed;
    try {
      parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Expected a JSON array');
    } catch (err) {
      el('msJsonStatus').textContent = `Invalid JSON: ${err.message}`;
      el('msJsonStatus').className = 'status err';
      return;
    }

    let matched = 0;
    const unmatched = [];
    parsed.forEach(rec => {
      let row = null;
      if (rec.playerId) {
        row = el('msPlayerRows').querySelector(`.edit-row[data-player-id="${rec.playerId}"]`);
      }
      if (!row && rec.name) {
        const target = String(rec.name).toLowerCase();
        row = Array.from(el('msPlayerRows').querySelectorAll('.edit-row'))
          .find(r => r.dataset.playerName.toLowerCase() === target);
      }
      if (!row) { unmatched.push(rec.playerId || rec.name || '?'); return; }

      row.querySelector('.ms-appearance').value = rec.appearance || 'start';
      row.querySelector('.ms-minutes').value = rec.minutes ?? '';
      row.querySelector('.ms-rating').value = rec.rating ?? '';
      row.querySelector('.ms-goals').value = rec.goals ?? 0;
      row.querySelector('.ms-assists').value = rec.assists ?? 0;
      row.querySelector('.ms-yellow').value = rec.yellowCards ?? 0;
      row.querySelector('.ms-red').value = rec.redCards ?? 0;
      row.querySelector('.ms-sub-on').value = rec.subOnMinute ?? '';
      row.querySelector('.ms-sub-off').value = rec.subOffMinute ?? '';
      row.querySelector('.ms-notes').value = rec.notes || '';
      matched++;
    });

    el('msJsonStatus').textContent = unmatched.length
      ? `Filled ${matched} row(s). Couldn't match: ${unmatched.join(', ')}`
      : `Filled ${matched} row(s) from JSON. Review below, then Save.`;
    el('msJsonStatus').className = unmatched.length ? 'status err' : 'status ok';
  };

  // Wipes every match-stats record for every fixture — deliberately blunt (no
  // per-match option) since its job is clearing out test/dummy data in one go,
  // both now (recovering from a mix-up) and later (right before kickoff).
  window.resetAllMatchStats = async () => {
    const sure = confirm('This permanently deletes ALL match stats for every fixture, not just the one currently selected. This cannot be undone. Continue?');
    if (!sure) return;
    const pin = el('ownerPin').value;
    el('manageMatchStatsStatus').textContent = 'Resetting…';
    el('manageMatchStatsStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/match-stats.json', content: [], message: 'Reset all match stats' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Reset failed');
      state.matchStats = [];
      renderMatchStatsPlayerRows();
      el('manageMatchStatsStatus').textContent = 'All match stats cleared. Start fresh from here.';
      el('manageMatchStatsStatus').className = 'status ok';
    } catch (err) {
      el('manageMatchStatsStatus').textContent = `Reset failed: ${err.message}`;
      el('manageMatchStatsStatus').className = 'status err';
    }
  };

  window.saveMatchStats = async () => {
    const matchId = matchStatsSelectedFixture;
    if (!matchId) return;
    const rows = el('msPlayerRows').querySelectorAll('.edit-row');
    const records = [];
    rows.forEach(row => {
      const appearance = row.querySelector('.ms-appearance').value;
      if (appearance === 'none') return; // not involved in this match — nothing to save
      const minutesVal = row.querySelector('.ms-minutes').value;
      const ratingVal = row.querySelector('.ms-rating').value;
      const subOnVal = row.querySelector('.ms-sub-on').value;
      const subOffVal = row.querySelector('.ms-sub-off').value;
      records.push({
        playerId: row.dataset.playerId,
        appearance,
        minutes: minutesVal === '' ? 0 : Number(minutesVal),
        goals: Number(row.querySelector('.ms-goals').value || 0),
        assists: Number(row.querySelector('.ms-assists').value || 0),
        yellowCards: Number(row.querySelector('.ms-yellow').value || 0),
        redCards: Number(row.querySelector('.ms-red').value || 0),
        rating: ratingVal === '' ? null : Number(ratingVal),
        subOnMinute: subOnVal === '' ? null : Number(subOnVal),
        subOffMinute: subOffVal === '' ? null : Number(subOffVal),
        notes: row.querySelector('.ms-notes').value.trim() || null,
      });
    });

    const pin = el('ownerPin').value;
    el('manageMatchStatsStatus').textContent = 'Saving…';
    el('manageMatchStatsStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/save-match-stats`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ matchId, records }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      state.matchStats = state.matchStats
        .filter(r => r.matchId !== matchId)
        .concat(records.map(r => ({ id: `ms_${matchId}_${r.playerId}`, matchId, ...r })));
      el('manageMatchStatsStatus').textContent = `Saved — ${records.length} player record(s) for this match.`;
      el('manageMatchStatsStatus').className = 'status ok';
    } catch (err) {
      el('manageMatchStatsStatus').textContent = `Failed: ${err.message}`;
      el('manageMatchStatsStatus').className = 'status err';
    }
  };

  el('findTeamBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('findTeamResults').innerHTML = 'Searching…';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/find-team?name=Sunderland`, {
        headers: { 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed');
      el('findTeamResults').innerHTML = (data.teams || []).map(t => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
          <span>${escapeHtml(t.name)} (${escapeHtml(t.country)}) — ID ${t.teamId}</span>
          <button class="primary" style="width:auto;padding:8px 12px;margin:0;" onclick="saveTeamId(${t.teamId})">Use this one</button>
        </div>
      `).join('') || '<div class="empty">No teams found</div>';
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  window.saveTeamId = async (teamId) => {
    const pin = el('ownerPin').value;
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/set-team`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ teamId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to save team');
      el('findTeamResults').innerHTML = `<div class="status ok">Saved team ID ${teamId}. Now tap "Sync squad".</div>`;
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  el('syncSquadBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('syncSquadBtn').disabled = true;
    el('syncStatus').textContent = 'Syncing…';
    el('syncStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/sync-squad`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sync failed');
      if (data.diagnostic) {
        el('syncStatus').textContent = `${data.diagnostic.message} (API results: ${data.diagnostic.apiResults})`;
        el('syncStatus').className = 'status err';
      } else {
        el('syncStatus').textContent = `Done — ${data.added} added, ${data.updated} updated, ${data.total} total players.`;
        el('syncStatus').className = 'status ok';
      }
    } catch (err) {
      el('syncStatus').textContent = `Failed: ${err.message}`;
      el('syncStatus').className = 'status err';
    } finally {
      el('syncSquadBtn').disabled = false;
    }
  };

  el('switchLink').onclick = (e) => {
    e.preventDefault();
    state.name = null;
    localStorage.removeItem('safc_name');
    el('signedInArea').style.display = 'none';
    el('pickerCard').style.display = 'block';
  };

  el('postCommentBtn').onclick = async () => {
    const text = el('commentText').value.trim();
    if (!text) return;
    el('postCommentBtn').disabled = true;
    el('commentStatus').textContent = 'Posting…';
    el('commentStatus').className = 'status';
    try {
      await apiPost('/api/comment', { name: state.name, text });
      el('commentText').value = '';
      el('commentStatus').textContent = 'Posted.';
      el('commentStatus').className = 'status ok';
      loadComments();
    } catch (err) {
      el('commentStatus').textContent = `Failed: ${err.message}`;
      el('commentStatus').className = 'status err';
    } finally {
      el('postCommentBtn').disabled = false;
    }
  };

  async function loadComments() {
    try {
      state.comments = await apiGet('data/comments.json') || [];
      const list = el('commentsList');
      if (!state.comments.length) {
        list.innerHTML = '<div class="empty">No comments yet</div>';
        return;
      }
      const isOwner = state.config && state.name === state.config.owner;
      list.innerHTML = state.comments.slice().reverse().map(c => `
        <div class="comment">
          <div class="meta">
            <b>${escapeHtml(c.name)}</b> · ${new Date(c.timestamp).toLocaleString()}
            ${isOwner ? ` · <a href="#" style="color:var(--safc-red);" onclick="deleteComment('${c.id}');return false;">delete</a>` : ''}
          </div>
          <div>${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    } catch (err) {
      el('commentsList').innerHTML = `<div class="empty">Couldn't load comments (${err.message})</div>`;
    }
  }

  window.deleteComment = async (id) => {
    const pin = prompt('Enter owner PIN to delete this comment:');
    if (!pin) return;
    try {
      const remaining = state.comments.filter(c => c.id !== id);
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/comments.json', content: remaining, message: 'Delete comment from app' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');
      loadComments();
    } catch (err) {
      alert(`Failed to delete: ${err.message}`);
    }
  };

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  init();
</script>
</body>
</html>
