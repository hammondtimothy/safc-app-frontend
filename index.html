<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAFC Player Ratings</title>

<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#EB172B" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --safc-red: #EB172B;
    --safc-red-dark: #B8101F;
    --ink: #14110F;
    --paper: #F7F5F2;
    --card: #FFFFFF;
    --line: #E4E0D9;
    --muted: #6B6560;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header.top {
    background: var(--safc-red);
    color: white;
    padding: calc(env(safe-area-inset-top) + 18px) 20px 22px;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute;
    top: 0; right: -10%;
    width: 40%; height: 100%;
    background: rgba(255,255,255,0.08);
    transform: skewX(-12deg);
  }
  header.top h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0;
    text-transform: uppercase;
  }
  header.top p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--safc-red);
    margin: 0 0 10px;
  }
  .name-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .name-btn {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .name-btn:active { background: var(--safc-red); color: white; border-color: var(--safc-red); }

  .whoami {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
  }
  .whoami b { color: var(--ink); }
  .switch-link {
    color: var(--safc-red);
    font-weight: 600;
    text-decoration: none;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    min-height: 70px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    resize: vertical;
  }
  button.primary {
    margin-top: 10px;
    background: var(--safc-red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }
  button.primary:active { background: var(--safc-red-dark); }
  button.primary:disabled { opacity: 0.5; }

  .comment {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .comment:last-child { border-bottom: none; }
  .comment .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .comment .meta b { color: var(--ink); }
  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
  }
  .status {
    font-size: 13px;
    margin-top: 8px;
  }
  .status.ok { color: #157F3B; }
  .status.err { color: var(--safc-red); }

  .position-group { margin-bottom: 14px; }
  .position-group:last-child { margin-bottom: 0; }
  .position-group h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row .num {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 26px;
    flex-shrink: 0;
  }
  .player-row .name { flex: 1; padding: 0 8px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .badge.squad { background: #E7F5EC; color: #157F3B; }
  .badge.loan { background: #FFF4E0; color: #A8630A; }
  .badge.academy { background: #E9EEFB; color: #2C4FA6; }
  .badge.left { background: #F1EFEB; color: var(--muted); }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .edit-row input, .edit-row select {
    width: 100%;
    padding: 8px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .edit-row-fields { display: flex; gap: 6px; }
  .edit-row-fields input:first-child { width: 54px; flex-shrink: 0; }
  .remove-player-link {
    color: var(--safc-red);
    font-size: 12px;
    text-decoration: none;
    align-self: flex-end;
  }

  .fixture-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .fixture-row:last-child { border-bottom: none; }
  .fixture-row .comp {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  .fixture-row .match-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3px;
  }
  .fixture-row .teams { font-weight: 600; }
  .fixture-row .datetime { color: var(--muted); font-size: 13px; }
  .fixture-row .score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<header class="top">
  <h1>SAFC Player Ratings</h1>
  <p id="seasonLabel">Loading season…</p>
</header>

<main>

  <!-- Stage 0 status card -->
  <div class="card" id="setupCard">
    <p class="eyebrow">Stage 0 check</p>
    <div id="setupStatus" class="status">Checking connection to the backend…</div>
  </div>

  <!-- Name picker -->
  <div class="card" id="pickerCard" style="display:none;">
    <p class="eyebrow">Who's this?</p>
    <div class="name-grid" id="nameGrid"></div>
  </div>

  <!-- Signed-in view -->
  <div id="signedInArea" style="display:none;">
    <div class="card">
      <div class="whoami">
        <span>Signed in as <b id="currentName"></b></span>
        <a href="#" class="switch-link" id="switchLink">Not you?</a>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">Test comment</p>
      <textarea id="commentText" placeholder="Say something about the Lads…"></textarea>
      <button class="primary" id="postCommentBtn">Post comment</button>
      <div id="commentStatus" class="status"></div>
    </div>

    <div class="card">
      <p class="eyebrow">Recent comments</p>
      <div id="commentsList"><div class="empty">No comments yet</div></div>
    </div>

    <div class="card">
      <p class="eyebrow">Fixtures</p>
      <div id="fixturesList"><div class="empty">Loading fixtures…</div></div>
    </div>

    <div class="card">
      <p class="eyebrow">Squad</p>
      <div id="squadList"><div class="empty">Loading squad…</div></div>
    </div>

    <div class="card" id="ownerToolsCard" style="display:none;">
      <p class="eyebrow">Owner tools</p>
      <input type="password" id="ownerPin" placeholder="Owner PIN" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:10px;" />

      <button class="primary" id="findTeamBtn" style="background:var(--ink);">Find Sunderland's team ID</button>
      <div id="findTeamResults" style="margin-top:10px;"></div>

      <button class="primary" id="syncSquadBtn" style="margin-top:14px;background:var(--ink);">Sync squad from API-Football</button>
      <div id="syncStatus" class="status"></div>

      <button class="primary" id="syncFixturesBtn" style="margin-top:14px;background:var(--ink);">Sync fixtures from API-Football</button>
      <div id="syncFixturesStatus" class="status"></div>

      <button class="primary" id="manageSquadBtn" style="margin-top:14px;">Manage squad</button>
      <div id="manageSquadArea" style="margin-top:12px;display:none;"></div>
      <div id="manageStatus" class="status"></div>
    </div>
  </div>

</main>

<script src="config.js"></script>
<script>
  const state = { name: localStorage.getItem('safc_name') || null, config: null, players: [], comments: [], fixtures: [] };

  const COUNTRIES = [
    ["England","GB-ENG"],["Scotland","GB-SCT"],["Wales","GB-WLS"],["Northern Ireland","GB-NIR"],
    ["Republic of Ireland","IE"],["France","FR"],["Germany","DE"],["Netherlands","NL"],["Belgium","BE"],
    ["Portugal","PT"],["Spain","ES"],["Italy","IT"],["Switzerland","CH"],["Austria","AT"],["Denmark","DK"],
    ["Norway","NO"],["Sweden","SE"],["Finland","FI"],["Iceland","IS"],["Poland","PL"],["Czech Republic","CZ"],
    ["Slovakia","SK"],["Hungary","HU"],["Romania","RO"],["Croatia","HR"],["Serbia","RS"],["Slovenia","SI"],
    ["Bosnia and Herzegovina","BA"],["Montenegro","ME"],["North Macedonia","MK"],["Albania","AL"],["Kosovo","XK"],
    ["Greece","GR"],["Turkey","TR"],["Ukraine","UA"],["Russia","RU"],["Ghana","GH"],["Nigeria","NG"],
    ["Senegal","SN"],["Ivory Coast","CI"],["Mali","ML"],["Guinea","GN"],["DR Congo","CD"],["Cameroon","CM"],
    ["Morocco","MA"],["Algeria","DZ"],["Tunisia","TN"],["Egypt","EG"],["South Africa","ZA"],["Brazil","BR"],
    ["Argentina","AR"],["Uruguay","UY"],["Paraguay","PY"],["Colombia","CO"],["Chile","CL"],["USA","US"],
    ["Canada","CA"],["Jamaica","JM"],["Trinidad and Tobago","TT"],["Australia","AU"],["Japan","JP"],
    ["South Korea","KR"],["Iran","IR"],["Israel","IL"],
  ];

  // Regional-indicator flag emoji from a 2-letter ISO code. Real flag emoji
  // work reliably everywhere, but England/Scotland/Wales use a special
  // multi-part Unicode sequence with inconsistent device support — when
  // unsupported it silently falls back to a plain black flag. Rather than
  // rely on that, those three get a small colored text badge instead.
  const HOME_NATION_BADGES = {
    'GB-ENG': '<span style="display:inline-block;background:#fff;color:#CE1124;border:1px solid #CE1124;border-radius:4px;padding:0 4px;font-size:10px;font-weight:700;">ENG</span>',
    'GB-SCT': '<span style="display:inline-block;background:#005EB8;color:#fff;border-radius:4px;padding:0 4px;font-size:10px;font-weight:700;">SCO</span>',
    'GB-WLS': '<span style="display:inline-block;background:#00843D;color:#fff;border-radius:4px;padding:0 4px;font-size:10px;font-weight:700;">WAL</span>',
  };

  function flagEmoji(code) {
    if (!code) return '';
    if (HOME_NATION_BADGES[code]) return HOME_NATION_BADGES[code];
    if (code === 'GB-NIR') return '🇬🇧';
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  // Plain-text-only version for use inside <option> tags, which can't render HTML
  function flagText(code) {
    if (!code) return '';
    if (code === 'GB-ENG') return '🏴 ENG';
    if (code === 'GB-SCT') return '🏴 SCO';
    if (code === 'GB-WLS') return '🏴 WAL';
    if (code === 'GB-NIR') return '🇬🇧';
    if (code === 'XK') return '🇽🇰';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }

  const el = (id) => document.getElementById(id);

  async function apiGet(file) {
    const res = await fetch(`${WORKER_URL}/api/data?file=${encodeURIComponent(file)}`);
    if (!res.ok) throw new Error(`Read failed (${res.status})`);
    return (await res.json()).content;
  }

  async function apiPost(path, body) {
    const res = await fetch(`${WORKER_URL}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    return res.json();
  }

  async function init() {
    if (!WORKER_URL || WORKER_URL.startsWith('REPLACE')) {
      el('setupStatus').textContent = 'config.js still has the placeholder Worker URL — edit it with your real Worker URL.';
      el('setupStatus').className = 'status err';
      return;
    }
    try {
      const health = await fetch(`${WORKER_URL}/api/health`).then(r => r.json());
      if (!health.ok) throw new Error('Backend did not report healthy');

      const config = await apiGet('data/config.json');
      state.config = config || { season: 'unknown', names: [] };
      el('seasonLabel').textContent = `${state.config.club || 'Sunderland AFC'} · ${state.config.season} season`;

      el('setupStatus').textContent = 'Connected to backend and repo successfully.';
      el('setupStatus').className = 'status ok';
      el('setupCard').style.display = 'none'; // hide once healthy, keeps the app clean day-to-day

      renderNamePicker();
      if (state.name) showSignedIn();
    } catch (err) {
      el('setupStatus').textContent = `Connection failed: ${err.message}. Check the Worker URL in config.js and that the Worker is deployed.`;
      el('setupStatus').className = 'status err';
    }
  }

  function renderNamePicker() {
    const grid = el('nameGrid');
    grid.innerHTML = '';
    (state.config.names || []).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.textContent = name;
      btn.onclick = () => {
        state.name = name;
        localStorage.setItem('safc_name', name);
        showSignedIn();
      };
      grid.appendChild(btn);
    });
    el('pickerCard').style.display = state.name ? 'none' : 'block';
  }

  function showSignedIn() {
    el('pickerCard').style.display = 'none';
    el('signedInArea').style.display = 'block';
    el('currentName').textContent = state.name;
    loadComments();
    loadSquad();
    loadFixtures();
    if (state.config && state.name === state.config.owner) {
      el('ownerToolsCard').style.display = 'block';
    }
  }

  const POSITION_ORDER = ['GK', 'DEF', 'MID', 'FWD'];
  const POSITION_LABELS = { GK: 'Goalkeepers', DEF: 'Defenders', MID: 'Midfielders', FWD: 'Forwards' };

  async function loadSquad() {
    try {
      state.players = await apiGet('data/players.json') || [];
      renderSquadList();
    } catch (err) {
      el('squadList').innerHTML = `<div class="empty">Couldn't load squad (${err.message})</div>`;
    }
  }

  function renderSquadList() {
    const container = el('squadList');
    if (!state.players.length) {
      container.innerHTML = '<div class="empty">No players yet</div>';
      return;
    }
    container.innerHTML = POSITION_ORDER.map(pos => {
      const players = state.players
        .filter(p => p.position === pos)
        .sort((a, b) => (a.squadNumber ?? 999) - (b.squadNumber ?? 999));
      if (!players.length) return '';
      const rows = players.map(p => `
        <div class="player-row">
          <span class="num">${p.squadNumber ?? '—'}</span>
          <span class="name">${flagEmoji(p.nationality)} ${escapeHtml(p.name)}${p.note ? ` <span style="color:var(--muted);font-size:12px;">— ${escapeHtml(p.note)}</span>` : ''}</span>
          <span class="badge ${p.status}">${p.status}</span>
        </div>
      `).join('');
      return `<div class="position-group"><h4>${POSITION_LABELS[pos]}</h4>${rows}</div>`;
    }).join('');
  }

  function formatFixtureDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) +
      ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadFixtures() {
    try {
      state.fixtures = await apiGet('data/fixtures.json') || [];
      renderFixturesList();
    } catch (err) {
      el('fixturesList').innerHTML = `<div class="empty">Couldn't load fixtures (${err.message})</div>`;
    }
  }

  function renderFixturesList() {
    const container = el('fixturesList');
    if (!state.fixtures.length) {
      container.innerHTML = '<div class="empty">No fixtures yet — tap "Sync fixtures" in Owner tools</div>';
      return;
    }
    container.innerHTML = state.fixtures.map(f => {
      const opponent = f.isHome ? f.awayTeam : f.homeTeam;
      const venueTag = f.isHome ? 'H' : 'A';
      let scoreOrTime;
      if (['FT', 'AET', 'PEN'].includes(f.status)) {
        scoreOrTime = `<span class="score">${f.homeScore} - ${f.awayScore}</span>`;
      } else if (f.status === 'PST') {
        scoreOrTime = '<span class="datetime">Postponed</span>';
      } else if (f.status === 'CANC') {
        scoreOrTime = '<span class="datetime">Cancelled</span>';
      } else {
        scoreOrTime = `<span class="datetime">${formatFixtureDate(f.date)}</span>`;
      }
      return `
        <div class="fixture-row">
          <div class="comp">${escapeHtml(f.competition)}${f.round ? ' · ' + escapeHtml(f.round) : ''}</div>
          <div class="match-line">
            <span class="teams">${venueTag} vs ${escapeHtml(opponent)}</span>
            ${scoreOrTime}
          </div>
        </div>
      `;
    }).join('');
  }

  el('syncFixturesBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('syncFixturesBtn').disabled = true;
    el('syncFixturesStatus').textContent = 'Syncing…';
    el('syncFixturesStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/sync-fixtures`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sync failed');
      el('syncFixturesStatus').textContent = `Done — ${data.total} fixtures synced.`;
      el('syncFixturesStatus').className = 'status ok';
      loadFixtures();
    } catch (err) {
      el('syncFixturesStatus').textContent = `Failed: ${err.message}`;
      el('syncFixturesStatus').className = 'status err';
    } finally {
      el('syncFixturesBtn').disabled = false;
    }
  };

  el('manageSquadBtn').onclick = () => {
    const area = el('manageSquadArea');
    const isOpen = area.style.display === 'block';
    area.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) renderManageSquad();
  };

  function renderManageSquad() {
    const area = el('manageSquadArea');
    area.innerHTML = state.players.map((p, i) => `
      <div class="edit-row" data-index="${i}">
        <div class="edit-row-fields">
          <input type="number" class="f-number" value="${p.squadNumber ?? ''}" placeholder="#" />
          <input type="text" class="f-name" value="${escapeHtml(p.name)}" placeholder="Name" />
        </div>
        <div class="edit-row-fields">
          <select class="f-position">
            ${POSITION_ORDER.map(pos => `<option value="${pos}" ${p.position === pos ? 'selected' : ''}>${pos}</option>`).join('')}
          </select>
          <select class="f-status">
            ${['squad','loan','academy','left'].map(s => `<option value="${s}" ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <select class="f-nationality">
          <option value="">— Nationality —</option>
          ${COUNTRIES.map(([name, code]) => `<option value="${code}" ${p.nationality === code ? 'selected' : ''}>${flagText(code)} ${name}</option>`).join('')}
        </select>
        <input type="text" class="f-note" value="${escapeHtml(p.note || '')}" placeholder="Note (e.g. on loan at...)" />
        <textarea class="f-bio" placeholder="Short biography — paste from safc.com" style="min-height:60px;">${escapeHtml(p.biography || '')}</textarea>
        <a href="#" class="remove-player-link" onclick="removePlayerRow(${i});return false;">Remove player</a>
      </div>
    `).join('') + `
      <button class="primary" style="background:var(--ink);margin-top:10px;" onclick="addPlayerRow()">+ Add player</button>
      <button class="primary" style="margin-top:8px;" onclick="saveSquad()">Save all changes</button>
    `;
  }

  window.addPlayerRow = () => {
    state.players.push({
      id: `manual_${Date.now()}`,
      name: '',
      squadNumber: null,
      position: 'MID',
      age: null,
      photo: null,
      status: 'squad',
      note: '',
      nationality: null,
      biography: '',
      seasonStats: {},
    });
    renderManageSquad();
  };

  window.removePlayerRow = (index) => {
    state.players.splice(index, 1);
    renderManageSquad();
  };

  window.saveSquad = async () => {
    const rows = el('manageSquadArea').querySelectorAll('.edit-row');
    rows.forEach(row => {
      const i = Number(row.dataset.index);
      const num = row.querySelector('.f-number').value;
      state.players[i].squadNumber = num === '' ? null : Number(num);
      state.players[i].name = row.querySelector('.f-name').value.trim();
      state.players[i].position = row.querySelector('.f-position').value;
      state.players[i].status = row.querySelector('.f-status').value;
      state.players[i].nationality = row.querySelector('.f-nationality').value || null;
      state.players[i].biography = row.querySelector('.f-bio').value.trim();
      state.players[i].note = row.querySelector('.f-note').value.trim() || null;
    });

    const pin = el('ownerPin').value;
    el('manageStatus').textContent = 'Saving…';
    el('manageStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/players.json', content: state.players, message: 'Manual squad edit from app' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      el('manageStatus').textContent = 'Saved.';
      el('manageStatus').className = 'status ok';
      renderSquadList();
    } catch (err) {
      el('manageStatus').textContent = `Failed: ${err.message}`;
      el('manageStatus').className = 'status err';
    }
  };

  el('findTeamBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('findTeamResults').innerHTML = 'Searching…';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/find-team?name=Sunderland`, {
        headers: { 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed');
      el('findTeamResults').innerHTML = (data.teams || []).map(t => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
          <span>${escapeHtml(t.name)} (${escapeHtml(t.country)}) — ID ${t.teamId}</span>
          <button class="primary" style="width:auto;padding:8px 12px;margin:0;" onclick="saveTeamId(${t.teamId})">Use this one</button>
        </div>
      `).join('') || '<div class="empty">No teams found</div>';
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  window.saveTeamId = async (teamId) => {
    const pin = el('ownerPin').value;
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/set-team`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ teamId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to save team');
      el('findTeamResults').innerHTML = `<div class="status ok">Saved team ID ${teamId}. Now tap "Sync squad".</div>`;
    } catch (err) {
      el('findTeamResults').innerHTML = `<div class="status err">${escapeHtml(err.message)}</div>`;
    }
  };

  el('syncSquadBtn').onclick = async () => {
    const pin = el('ownerPin').value;
    el('syncSquadBtn').disabled = true;
    el('syncStatus').textContent = 'Syncing…';
    el('syncStatus').className = 'status';
    try {
      const res = await fetch(`${WORKER_URL}/api/owner/sync-squad`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sync failed');
      if (data.diagnostic) {
        el('syncStatus').textContent = `${data.diagnostic.message} (API results: ${data.diagnostic.apiResults})`;
        el('syncStatus').className = 'status err';
      } else {
        el('syncStatus').textContent = `Done — ${data.added} added, ${data.updated} updated, ${data.total} total players.`;
        el('syncStatus').className = 'status ok';
      }
    } catch (err) {
      el('syncStatus').textContent = `Failed: ${err.message}`;
      el('syncStatus').className = 'status err';
    } finally {
      el('syncSquadBtn').disabled = false;
    }
  };

  el('switchLink').onclick = (e) => {
    e.preventDefault();
    state.name = null;
    localStorage.removeItem('safc_name');
    el('signedInArea').style.display = 'none';
    el('pickerCard').style.display = 'block';
  };

  el('postCommentBtn').onclick = async () => {
    const text = el('commentText').value.trim();
    if (!text) return;
    el('postCommentBtn').disabled = true;
    el('commentStatus').textContent = 'Posting…';
    el('commentStatus').className = 'status';
    try {
      await apiPost('/api/comment', { name: state.name, text });
      el('commentText').value = '';
      el('commentStatus').textContent = 'Posted.';
      el('commentStatus').className = 'status ok';
      loadComments();
    } catch (err) {
      el('commentStatus').textContent = `Failed: ${err.message}`;
      el('commentStatus').className = 'status err';
    } finally {
      el('postCommentBtn').disabled = false;
    }
  };

  async function loadComments() {
    try {
      state.comments = await apiGet('data/comments.json') || [];
      const list = el('commentsList');
      if (!state.comments.length) {
        list.innerHTML = '<div class="empty">No comments yet</div>';
        return;
      }
      const isOwner = state.config && state.name === state.config.owner;
      list.innerHTML = state.comments.slice().reverse().map(c => `
        <div class="comment">
          <div class="meta">
            <b>${escapeHtml(c.name)}</b> · ${new Date(c.timestamp).toLocaleString()}
            ${isOwner ? ` · <a href="#" style="color:var(--safc-red);" onclick="deleteComment('${c.id}');return false;">delete</a>` : ''}
          </div>
          <div>${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    } catch (err) {
      el('commentsList').innerHTML = `<div class="empty">Couldn't load comments (${err.message})</div>`;
    }
  }

  window.deleteComment = async (id) => {
    const pin = prompt('Enter owner PIN to delete this comment:');
    if (!pin) return;
    try {
      const remaining = state.comments.filter(c => c.id !== id);
      const res = await fetch(`${WORKER_URL}/api/owner-write`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Pin': pin },
        body: JSON.stringify({ file: 'data/comments.json', content: remaining, message: 'Delete comment from app' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');
      loadComments();
    } catch (err) {
      alert(`Failed to delete: ${err.message}`);
    }
  };

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  init();
</script>
</body>
</html>
